<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinical Hours — Premier Signature Program</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F5F0E8;color:#1E1E1E;min-height:100vh}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1B2A4A}
.lbox{background:#fff;border-radius:16px;padding:40px;width:340px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.lbox h1{font-size:18px;color:#1B2A4A;margin-bottom:6px}.lbox p{font-size:11px;color:#999;margin-bottom:20px;line-height:1.6}
.lbox input{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;margin-bottom:10px}
.lbox button{width:100%;padding:10px;background:#1B2A4A;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
#err{color:#c00;font-size:11px;margin-top:6px;min-height:15px}
#app{display:none}
.topbar{background:#1B2A4A;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:15px;font-weight:700}.topbar .sub{font-size:10px;color:#A0B0C8;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:#555;display:inline-block;margin-right:4px}.dot.on{background:#4ade80}
.tabs{background:#fff;border-bottom:2px solid #E5E2DE;display:flex;padding:0 20px;gap:2px}
.tab{padding:11px 18px;font-size:12px;font-weight:600;color:#888;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab:hover{color:#1B2A4A}.tab.on{color:#1B2A4A;border-bottom-color:#1B2A4A}
.frow{background:#fff;border-bottom:1px solid #E5E2DE;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.frow label{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.frow input[type=month]{padding:5px 9px;border:1px solid #ddd;border-radius:6px;font-size:11px;color:#333}
.frow select{padding:5px 9px;border:1px solid #ddd;border-radius:6px;font-size:11px;color:#333;background:#fff}
.pg{padding:18px 20px}
.krow{display:grid;gap:10px;margin-bottom:16px}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}
@media(max-width:800px){.k4,.k3{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border-radius:10px;border:1px solid #E5E2DE;padding:14px 10px;text-align:center}
.kpi .n{font-size:26px;font-weight:700;color:#1B2A4A;line-height:1}.kpi .l{font-size:9px;font-weight:700;color:#7A6A56;text-transform:uppercase;letter-spacing:.06em;margin-top:5px}.kpi .s{font-size:10px;color:#aaa;margin-top:2px}
.kpi.ck .n{color:#2D6A4F}.kpi.cw .n{color:#D97706}.kpi.co .n{color:#1A56DB}
.card{background:#fff;border-radius:10px;border:1px solid #E5E2DE;padding:16px;margin-bottom:12px}
.ct{font-size:10px;font-weight:700;color:#7A6A56;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:800px){.r2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:11px}
th{padding:7px 9px;background:#1B2A4A;color:#fff;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
th.r{text-align:right}
td{padding:6px 9px;border-bottom:.5px solid #F0EDE8}td.r{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#FAFAF8}.totrow td{background:#F5F0E8;font-weight:700}
.z{color:#CCC}
.badge{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:600}
.bc{background:#EEF2FF;color:#1B2A4A}.ba{background:#E8F5E9;color:#2D4A3E}
.bw2{background:#F0F4FF;color:#3730A3}.bctr{background:#FEF3C7;color:#92400E}
.bk{background:#E8F5E9;color:#2D4A3E}.bb{background:#DBEAFE;color:#1E40AF}.bam{background:#FEF3C7;color:#92400E}
.sec-hdr{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:5px 9px;color:#fff}
.sec-clin{background:#1B2A4A}.sec-anc{background:#2D6A4F}
.bar-wrap{margin:8px 0}.bar-label{font-size:10px;color:#555;margin-bottom:2px}.bar-track{background:#F0EDE8;border-radius:4px;height:14px;overflow:hidden}.bar-fill{height:100%;border-radius:4px;transition:width .3s}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lbox">
    <div style="font-size:32px;margin-bottom:10px">⏱</div>
    <h1>Clinical Hours</h1>
    <p>Premier Signature Program · Lifeskills Behavioral Health<br>Leadership access only</p>
    <input type="password" id="pw" placeholder="Access code" autocomplete="off" onkeydown="if(event.key==='Enter')go()">
    <button onclick="go()">Access Report</button>
    <div id="err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div>
      <h1>Clinical Hours — Premier Signature Program</h1>
      <div class="sub"><span class="dot" id="ldot"></span><span id="llbl">Connecting…</span> · Completed direct service sessions</div>
    </div>
    <a href="/index.html" style="color:#A0B0C8;font-size:11px;text-decoration:none">← Calendar</a>
  </div>
  <div class="tabs">
    <div class="tab on" data-t="monthly">Monthly Summary</div>
    <div class="tab" data-t="provider">By Provider</div>
    <div class="tab" data-t="audit">Client Daily Audit</div>
    <div class="tab" data-t="roster">Provider Roster</div>
  </div>
  <div class="frow">
    <div><label>From</label><input type="month" id="f-from" value="2026-04" onchange="render()"></div>
    <div style="font-size:14px;color:#ddd">–</div>
    <div><input type="month" id="f-to" onchange="render()"></div>
    <div style="margin-left:12px"><label>Program</label>
      <select id="f-prog" onchange="render()">
        <option value="">All</option><option value="sig">Signature</option><option value="pdi">PDI</option>
      </select>
    </div>
    <div style="margin-left:auto">
      <button onclick="exportCSV()" style="padding:6px 14px;border:1px solid #1B2A4A;background:#fff;color:#1B2A4A;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer">↓ Export</button>
    </div>
  </div>
  <div class="pg" id="pg-load" style="text-align:center;padding:60px;color:#888">Loading…</div>
  <div id="pg" style="display:none"></div>
</div>

<script>
const PW='ClinicalHours2026', TARGET=5;
var DATA={events:[],clients:[]}, _ok=false, _tab='monthly', _auditWkIdx=0;

/* ── Classification ─────────────────────────────────────────── */
var SKIP=['luis guillermo','keisha foster','lead tech','tech team','brandy','hume','none','tbd','family','n/a',''];
var CLIN_KW=['individual','family','therapy','dbt','trauma','anger','relapse','caseload','testing','assessment','psychometric','neuropsych','evaluation','interview','psych','psychiatric','nursing','medical','debriefing','court','prevention','group'];
var FORCE_ANC_SVCS=['lunch','photomodulation','cognitive remediation','orientation'];
var FORCE_CLIN=['nursing','brian','paul lazar','dr. paul'];
var FORCE_ANC=['anthony','heather','alice','flavia','rabbi','nicole'];
var W2=['nicole williams','nicole','tara alhadeff','tara','mirella ezeta','dr. mirella','rabbi brandon gaines','rabbi gaines','rabbi','sandra bernstein','sandy','despina karfis','dr. despina','alexandra marullo','dr. alex','robert bruno','dr. bruno','tamas biro','tamas','paul lazar','dr. paul','dr. hume','anisha hume','t.d.','td','esther entin','esther','miguel','nichole bessent','gina bonfigli','gina','david ockman','ockman','nicole williams','gus hernandez','dr. greg','gregory fortune','greg fortune'];
var CTR=['david forstadt','dr. forstadt','forstadt','anthony','heather','alice','dr. flannery','flannery','pbwi','brian','dr. spaedy','spaedy','nursing','dr. flavia','flavia','dr. shaeffer','shaeffer','dr. bober','bober','thomas young','dr. smith','smith'];

function isSkip(p,svc){
  var pl=(p||'').trim().toLowerCase(), sl=(svc||'').toLowerCase();
  if(!pl||SKIP.some(function(s){return pl===s;})||pl.indexOf('lead tech')>-1) return true;
  if((pl.indexOf('paul')>-1||pl.indexOf('lazar')>-1)&&sl.indexOf('lunch')>-1) return true;
  if((pl.indexOf('sandy')>-1||pl.indexOf('sandra')>-1||pl.indexOf('bernstein')>-1)&&(sl.indexOf('cognitive')>-1||sl.indexOf('remediation')>-1)) return true;
  return false;
}
function isClin(ev){
  var pl=(ev.provider||'').toLowerCase(), sl=(ev.service||'').toLowerCase();
  if(!pl) return CLIN_KW.some(function(k){return sl.indexOf(k)>-1;}); // no provider — classify by service only
  if(pl.indexOf('tamas')>-1&&sl.indexOf('spiritual')>-1) return false;
  if(sl.indexOf('spiritual')>-1&&sl.indexOf('group')<0) return false;
  if(FORCE_ANC_SVCS.some(function(s){return sl.indexOf(s)>-1;})) return false;
  if(FORCE_CLIN.some(function(f){return pl.indexOf(f)>-1;})) return true;
  if(FORCE_ANC.some(function(f){return pl.indexOf(f)>-1;})) return false;
  return CLIN_KW.some(function(k){return sl.indexOf(k)>-1;});
}
function getHrs(ev){return((ev.duration||2)/2);}
function emp(p){
  var pl=(p||'').trim().toLowerCase();
  if(W2.some(function(w){return pl===w;})) return 'W2';
  if(CTR.some(function(c){return pl===c;})) return 'Contractor';
  return 'Unknown';
}
function prog(ev){
  var p=(ev.program||'').toLowerCase().trim();
  if(!p&&ev.clientId){var cl=DATA.clients.find(function(c){return c.id===ev.clientId;});if(cl)p=(cl.program||'').toLowerCase();}
  return p;
}
function getEvs(){
  var from=document.getElementById('f-from').value, to=document.getElementById('f-to').value, pg=document.getElementById('f-prog').value;
  var all=DATA.events, passed=[];
  var dbg={total:all.length,noDate:0,noProvider:0,noStatus:0,notCompleted:0,skipped:0,outOfRange:0,progFilter:0,passed:0};
  // Log unique status values for diagnosis
  var statuses={};all.forEach(function(e){statuses[e.status||'(none)']=(statuses[e.status||'(none)']||0)+1;});
  console.log('[Clinical Hours] Status values in data:',statuses);
  all.forEach(function(ev){
    if(!ev.date){dbg.noDate++;return;}
    if(!ev.provider){dbg.noProvider++;return;}
    // Accept completed or no status (treat missing status as valid)
    if(ev.status&&ev.status.toLowerCase()!=='completed'){dbg.notCompleted++;return;}
    if(isSkip(ev.provider,ev.service)){dbg.skipped++;return;}
    var mo=ev.date.slice(0,7);
    if(from&&mo<from){dbg.outOfRange++;return;}
    if(to&&mo>to){dbg.outOfRange++;return;}
    if(pg){var p=prog(ev);
      if(pg==='sig'&&p&&p!=='signature'&&p!=='sig'&&p!=='both'){dbg.progFilter++;return;}
      if(pg==='pdi'&&p&&p!=='pdi'&&p!=='both'){dbg.progFilter++;return;}}
    dbg.passed++;passed.push(ev);
  });
  console.log('[Clinical Hours] Filter debug:',dbg);
  return passed;
}

// Audit uses ALL client-linked events — no provider required
function getAuditEvs(){
  var from=document.getElementById('f-from').value, to=document.getElementById('f-to').value;
  // Log sample events to understand structure
  var sample=DATA.events.filter(function(ev){
    var sl=(ev.service||'').toLowerCase();
    return sl.indexOf('group')>-1;
  }).slice(0,3);
  console.log('[Audit] Sample GROUP events (first 3):',JSON.stringify(sample));
  var allKeys={};DATA.events.slice(0,50).forEach(function(ev){Object.keys(ev).forEach(function(k){allKeys[k]=true;});});
  console.log('[Audit] All event field names found:',Object.keys(allKeys).join(', '));

  return DATA.events.filter(function(ev){
    if(!ev.date) return false;
    if(ev.status&&['cancelled','rescheduled'].indexOf(ev.status.toLowerCase())>-1) return false;
    if(isSkip(ev.provider||'',ev.service)) return false;
    var mo=ev.date.slice(0,7);
    if(from&&mo<from) return false;
    if(to&&mo>to) return false;
    // Check all possible client link fields
    var hasClient=ev.clientId||
      (ev.clientIds&&ev.clientIds.length)||
      (ev.clients&&ev.clients.length)||
      (ev.attendees&&ev.attendees.length)||
      (ev.participants&&ev.participants.length)||
      ev.client;
    return !!hasClient;
  });
}

/* ── Auth ──────────────────────────────────────────────────── */
function go(){
  if((document.getElementById('pw').value||'').trim()===PW){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    initFB();
  }else{document.getElementById('err').textContent='Incorrect code.';setTimeout(function(){document.getElementById('err').textContent='';},2000);}
}

/* ── Firebase ──────────────────────────────────────────────── */
function initFB(){
  firebase.initializeApp({databaseURL:'https://pdi-signature-schedule-default-rtdb.firebaseio.com'});
  firebase.database().ref('schedule_v3').on('value',function(snap){
    var raw=snap.val();
    if(raw&&raw.blob){try{var d=JSON.parse(raw.blob);if(Array.isArray(d.events))DATA.events=d.events;if(Array.isArray(d.clients))DATA.clients=d.clients;}catch(e){console.error(e);}}
    document.getElementById('ldot').className='dot on';document.getElementById('llbl').textContent='Live';
    _ok=true;
    var now=new Date();document.getElementById('f-to').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    document.getElementById('pg-load').style.display='none';document.getElementById('pg').style.display='block';
    render();
  });
}

/* ── Tabs ──────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click',function(){
      document.querySelectorAll('.tab').forEach(function(x){x.className='tab';});
      t.className='tab on';_tab=t.dataset.t;if(_ok)render();
    });
  });
});

/* ── Helpers ───────────────────────────────────────────────── */
function moKey(d){return(d||'').slice(0,7);}
function wkSun(d){var dt=new Date((d||'').slice(0,10)+'T12:00:00');if(isNaN(dt))return '';dt.setDate(dt.getDate()-dt.getDay());return dt.toISOString().slice(0,10);}
function moLbl(k){return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+k.slice(5,7)-1]+' '+k.slice(0,4);}
function kpi(n,l,s,cls){return '<div class="kpi'+(cls?' '+cls:'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div>'+(s?'<div class="s">'+s+'</div>':'')+
'</div>';}
/* ── Pure Canvas Charts (no library) ───────────────────── */
function destroyCharts(){}
function drawBar(canvasId,labels,datasets,opts){
  var cv=document.getElementById(canvasId);if(!cv)return;
  var ctx=cv.getContext('2d');
  var parent=cv.parentElement;
  var W=parent.offsetWidth||parent.parentElement.offsetWidth||600;
  var H=opts&&opts.horiz?Math.max(180,labels.length*28+60):260;
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=W*window.devicePixelRatio;cv.height=H*window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  var horiz=opts&&opts.horiz,stacked=opts&&opts.stacked;
  var pad={t:20,r:20,b:50,l:horiz?120:40};
  var allVals=[];
  datasets.forEach(function(ds){ds.data.forEach(function(v){allVals.push(v);});});
  var maxV=stacked?labels.map(function(_,i){return datasets.reduce(function(s,ds){return s+(ds.data[i]||0);},0);}).reduce(function(a,b){return Math.max(a,b);},0):Math.max.apply(null,allVals)||1;
  maxV=Math.ceil(maxV/10)*10||10;
  var n=labels.length,gw=(horiz?H-pad.t-pad.b:W-pad.l-pad.r),gh=horiz?W-pad.l-pad.r:H-pad.t-pad.b;
  var barSz=(horiz?gw/n:gw/n)*0.65,gap=(horiz?gw/n:gw/n)*0.35;
  ctx.clearRect(0,0,W,H);
  // Grid lines
  ctx.strokeStyle='#F0EDE8';ctx.lineWidth=1;
  for(var g=0;g<=5;g++){
    var v=maxV*g/5;
    if(horiz){var x=pad.l+v/maxV*gh;ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,H-pad.b);ctx.stroke();}
    else{var y=H-pad.b-v/maxV*gh;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
      ctx.fillStyle='#aaa';ctx.font='9px Arial';ctx.textAlign='right';ctx.fillText(Math.round(v),pad.l-4,y+3);}
  }
  // Bars
  labels.forEach(function(lbl,i){
    var offset=stacked?0:0;
    datasets.forEach(function(ds,di){
      var val=ds.data[i]||0;
      ctx.fillStyle=ds.color||'#1B2A4A';
      if(horiz){
        var y=pad.t+i*(gw/n)+gap/2+(stacked?0:di*barSz/datasets.length);
        var bh=stacked?barSz:barSz/datasets.length;
        var x=pad.l+(stacked?offset/maxV*gh:0);
        var bw=val/maxV*gh;
        ctx.fillRect(x,y,bw,bh-2);
        if(val>0){ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.textAlign='left';ctx.fillText(Math.round(val*10)/10,x+bw+3,y+bh/2+3);}
        if(stacked)offset+=val;
      } else {
        var x=pad.l+i*(gw/n)+gap/2+(stacked?0:di*barSz/datasets.length);
        var bw2=stacked?barSz:barSz/datasets.length;
        var bh2=val/maxV*gh;
        var y2=H-pad.b-(stacked?offset+val:val)/maxV*gh+(stacked?val/maxV*gh:0);
        ctx.fillRect(x,H-pad.b-(stacked?offset+val:val)/maxV*gh,bw2-1,val/maxV*gh);
        if(stacked)offset+=val;
      }
    });
    // Labels
    ctx.fillStyle='#555';ctx.font='9px Arial';
    if(horiz){ctx.textAlign='right';ctx.fillText(lbl,pad.l-4,pad.t+i*(gw/n)+barSz/2+3);}
    else{ctx.textAlign='center';var lx=pad.l+i*(gw/n)+barSz/2+gap/2;ctx.fillText(lbl.length>8?lbl.slice(0,8)+'…':lbl,lx,H-pad.b+12);}
  });
  // Legend
  var lx=pad.l,ly=H-12;
  datasets.forEach(function(ds){
    ctx.fillStyle=ds.color||'#1B2A4A';ctx.fillRect(lx,ly-8,10,8);
    ctx.fillStyle='#555';ctx.font='9px Arial';ctx.textAlign='left';ctx.fillText(ds.label||'',lx+13,ly);
    lx+=ctx.measureText(ds.label||'').width+26;
  });
}

function render(){
  if(!_ok)return;destroyCharts();
  var evs=getEvs(),el=document.getElementById('pg');
  el.innerHTML='';var wrap=document.createElement('div');wrap.className='pg';
  if(_tab==='monthly') renderMonthly(wrap,evs);
  else if(_tab==='provider') renderProvider(wrap,evs);
  else if(_tab==='audit') renderAudit(wrap,getAuditEvs());
  else renderRoster(wrap,evs);
  el.appendChild(wrap);
}

/* ══ MONTHLY ════════════════════════════════════════════════ */
function renderMonthly(el,evs){
  var byMo={};var mos=new Set();
  evs.forEach(function(ev){
    var mo=moKey(ev.date);mos.add(mo);var h=getHrs(ev);
    if(!byMo[mo])byMo[mo]={clin:0,anc:0,w2:0,ctr:0};
    if(isClin(ev))byMo[mo].clin+=h;else byMo[mo].anc+=h;
    var e=emp(ev.provider);if(e==='W2')byMo[mo].w2+=h;else if(e==='Contractor')byMo[mo].ctr+=h;
  });
  var months=[...mos].sort();
  var tc=evs.reduce(function(s,e){return s+(isClin(e)?getHrs(e):0);},0);
  var ta=evs.reduce(function(s,e){return s+(isClin(e)?0:getHrs(e));},0);
  var tw=evs.reduce(function(s,e){return s+(emp(e.provider)==='W2'?getHrs(e):0);},0);
  var tctr=evs.reduce(function(s,e){return s+(emp(e.provider)==='Contractor'?getHrs(e):0);},0);

  el.innerHTML='<div class="krow k4">'+
    kpi(Math.round(tw+tctr),'Total Hours',months.length+' months')+
    kpi(Math.round(tc),'Clinician Hours','Individual · Family · Testing','')+
    kpi(Math.round(ta),'Ancillary Hours','All other services','')+
    kpi(months.length,'Months','')+
  '</div>';

  var c1=document.createElement('div');c1.className='card';
  c1.innerHTML='<div class="ct">Monthly Sessions — Clinician vs Ancillary</div><div style="position:relative;height:260px"><canvas id="ch-mo1"></canvas></div>';
  el.appendChild(c1);

  var c2=document.createElement('div');c2.className='card';
  c2.innerHTML='<div class="ct">Monthly Sessions — Salaried vs Contractor</div><div style="position:relative;height:220px"><canvas id="ch-mo2"></canvas></div>';
  el.appendChild(c2);

  var tbl='<div class="card"><div class="ct">Monthly Detail</div><div style="overflow-x:auto"><table><thead><tr>'+
    '<th>Month</th><th class="r">Clinician Hrs</th><th class="r">Ancillary Hrs</th><th class="r">Total Hrs</th><th class="r">Salaried</th><th class="r">Contractor</th></tr></thead><tbody>'+
    months.map(function(mo){var r=byMo[mo];return '<tr><td><b>'+moLbl(mo)+'</b></td>'+
      '<td class="r">'+Math.round(r.clin)+'</td><td class="r">'+Math.round(r.anc)+'</td>'+
      '<td class="r"><b>'+Math.round(r.clin+r.anc)+'</b></td>'+
      '<td class="r">'+Math.round(r.w2)+'</td><td class="r">'+Math.round(r.ctr)+'</td></tr>';}).join('')+
    '<tr class="totrow"><td>Total</td><td class="r">'+Math.round(tc)+'</td><td class="r">'+Math.round(ta)+'</td>'+
    '<td class="r">'+Math.round(tc+ta)+'</td><td class="r">'+Math.round(tw)+'</td><td class="r">'+Math.round(tctr)+'</td></tr>'+
    '</tbody></table></div></div>';
  el.innerHTML+=tbl;

  setTimeout(function(){
    drawBar('ch-mo1',months.map(moLbl),[
      {label:'Clinician',data:months.map(function(m){return Math.round(byMo[m].clin);}),color:'#1B2A4A'},
      {label:'Ancillary',data:months.map(function(m){return Math.round(byMo[m].anc);}),color:'#2D6A4F'}
    ],{stacked:true});
    drawBar('ch-mo2',months.map(moLbl),[
      {label:'Salaried (W2)',data:months.map(function(m){return Math.round(byMo[m].w2);}),color:'#1B2A4A'},
      {label:'Contractor',data:months.map(function(m){return Math.round(byMo[m].ctr);}),color:'#C4924A'}
    ],{stacked:true});
  },60);
}

/* ══ BY PROVIDER ════════════════════════════════════════════ */
function renderProvider(el,evs){
  var byP={};
  evs.forEach(function(ev){
    var p=ev.provider,h=getHrs(ev);
    if(!byP[p])byP[p]={clin:0,anc:0,ancSvcs:{}};
    if(isClin(ev))byP[p].clin+=h;
    else{byP[p].anc+=h;var s=ev.service||'—';byP[p].ancSvcs[s]=(byP[p].ancSvcs[s]||0)+h;}
  });
  var clinPs=Object.entries(byP).filter(function(kv){return kv[1].clin>0;}).sort(function(a,b){return b[1].clin-a[1].clin;});
  var ancPs=Object.entries(byP).filter(function(kv){return kv[1].clin===0&&kv[1].anc>0;}).sort(function(a,b){return b[1].anc-a[1].anc;});
  var mixPs=Object.entries(byP).filter(function(kv){return kv[1].clin>0&&kv[1].anc>0;});
  var tc=evs.reduce(function(s,e){return s+(isClin(e)?getHrs(e):0);},0);
  var ta=evs.reduce(function(s,e){return s+(isClin(e)?0:getHrs(e));},0);

  el.innerHTML='<div class="krow k4">'+
    kpi(clinPs.length,'Clinician Providers','')+kpi(Math.round(tc)+' hrs','Clinician Hours','')+
    kpi(ancPs.length,'Ancillary Providers','')+kpi(Math.round(ta)+' hrs','Ancillary Hours','')+
  '</div>';

  var h1=Math.max(200,clinPs.length*26)+'px',h2=Math.max(200,ancPs.length*26)+'px';
  var c=document.createElement('div');c.className='r2';
  c.innerHTML='<div class="card"><div class="ct" style="color:#1B2A4A">Clinician Providers</div>'+
    '<div style="font-size:10px;color:#999;margin-bottom:8px">Therapy · Testing · Assessment</div>'+
    '<div style="position:relative;min-height:'+h1+'"><canvas id="ch-clin" style="width:100%"></canvas></div></div>'+
    '<div class="card"><div class="ct" style="color:#2D6A4F">Ancillary Providers</div>'+
    '<div style="font-size:10px;color:#999;margin-bottom:8px">All other completed services</div>'+
    '<div style="position:relative;min-height:'+h2+'"><canvas id="ch-anc" style="width:100%"></canvas></div></div>';
  el.appendChild(c);

  // Detail table — no unique clients, no active months
  var t='<div class="card"><div style="overflow-x:auto"><table><thead>'+
    '<tr><th colspan="2" class="sec-hdr sec-clin">Clinician Providers — Direct Service Hours</th></tr>'+
    '<tr><th>Provider</th><th class="r">Hours</th></tr></thead><tbody>'+
    clinPs.map(function(kv){var r=kv[1],et=emp(kv[0]);
      return '<tr><td><b>'+kv[0]+'</b></td>'+
        '<td class="r"><b>'+Math.round(r.clin*10)/10+' hrs</b></td></tr>';}).join('')+
    '<tr><th colspan="2" class="sec-hdr sec-anc">Ancillary Providers — Support Services</th></tr>'+
    '<tr><th>Provider</th><th class="r">Hours</th></tr>'+
    ancPs.map(function(kv){var r=kv[1];
      var svcs=Object.entries(r.ancSvcs).sort(function(a,b){return b[1]-a[1];}).slice(0,3).map(function(s){return s[0];}).join(' · ');
      return '<tr><td><b>'+kv[0]+'</b><span style="font-size:10px;color:#999;margin-left:8px">'+svcs+'</span></td>'+
        '<td class="r"><b>'+Math.round(r.anc*10)/10+' hrs</b></td></tr>';}).join('')+
    '</tbody></table></div></div>';
  el.innerHTML+=t;

  if(mixPs.length){
    el.innerHTML+='<div class="card" style="border-color:#D97706"><div class="ct" style="color:#92400E">Service Label Review — Clinician Providers with Ancillary-Coded Sessions</div>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>Provider</th><th class="r">Clinician Hrs</th><th class="r">Ancillary Hrs</th><th>Ancillary Service Labels</th></tr></thead><tbody>'+
      mixPs.sort(function(a,b){return b[1].anc-a[1].anc;}).map(function(kv){var r=kv[1];
        var tags=Object.entries(r.ancSvcs).sort(function(a,b){return b[1]-a[1];})
          .map(function(s){return '<span class="badge bam" style="margin:2px">'+s[0]+' ×'+Math.round(s[1])+'</span>';}).join('');
        return '<tr><td><b>'+kv[0]+'</b></td><td class="r">'+Math.round(r.clin*10)/10+'</td><td class="r" style="color:#92400E;font-weight:600">'+Math.round(r.anc*10)/10+'</td><td>'+tags+'</td></tr>';}).join('')+
      '</tbody></table></div></div>';
  }

  setTimeout(function(){
    if(clinPs.length)drawBar('ch-clin',clinPs.map(function(p){return p[0];}),
      [{label:'Hours',data:clinPs.map(function(p){return Math.round(p[1].clin*10)/10;}),color:'#1B2A4A'}],{horiz:true});
    if(ancPs.length)drawBar('ch-anc',ancPs.map(function(p){return p[0];}),
      [{label:'Hours',data:ancPs.map(function(p){return Math.round(p[1].anc*10)/10;}),color:'#2D6A4F'}],{horiz:true});
  },60);
}

/* ══ CLIENT DAILY AUDIT ═════════════════════════════════════ */
function renderAudit(el,evs){
  // Visible diagnostic panel
  var rawEvs=DATA.events;
  var dbgTotal=rawEvs.length;
  var dbgPassed=evs.length;
  var statuses={};rawEvs.forEach(function(e){var s=e.status||'(none)';statuses[s]=(statuses[s]||0)+1;});
  var statusStr=Object.entries(statuses).map(function(kv){return kv[0]+': '+kv[1];}).join(' · ');
  var dbg=document.createElement('div');
  dbg.style.cssText='background:#F0F4FF;border:1px solid #C7D2FE;border-radius:8px;padding:10px 16px;margin-bottom:14px;font-size:11px;line-height:1.9';
  dbg.innerHTML='<b style="color:#1B2A4A">Audit Filter</b> — counts ALL client-linked sessions (completed + scheduled, excludes cancelled/rescheduled)<br>'+
    'Total Firebase events: <b>'+dbgTotal+'</b> · Counting for audit: <b style="color:#2D6A4F">'+dbgPassed+'</b> · '+
    'Status values: <span style="color:#555">'+statusStr+'</span>';
  el.appendChild(dbg);

  var byCD={},cnames={},allWks=new Set();
  evs.forEach(function(ev){
    if(!ev.date) return;
    var day=ev.date.slice(0,10),wk=wkSun(day),h=getHrs(ev);
    // Collect client IDs from all possible fields
    var ids=[];
    function addId(id){if(id&&ids.indexOf(String(id))<0)ids.push(String(id));}
    if(ev.clientId) addId(ev.clientId);
    if(ev.client) addId(ev.client);
    if(ev.clientIds&&Array.isArray(ev.clientIds)) ev.clientIds.forEach(addId);
    if(ev.clients&&Array.isArray(ev.clients)) ev.clients.forEach(function(c){addId(typeof c==='object'?c.id||c:c);});
    if(ev.attendees&&Array.isArray(ev.attendees)) ev.attendees.forEach(function(c){addId(typeof c==='object'?c.id||c:c);});
    if(ev.participants&&Array.isArray(ev.participants)) ev.participants.forEach(function(c){addId(typeof c==='object'?c.id||c:c);});
    if(!ids.length) return;
    allWks.add(wk);
    ids.forEach(function(cid){
      var k=cid+'|'+day;
      if(!byCD[k])byCD[k]={id:cid,date:day,wk:wk,clin:0,anc:0};
      if(isClin(ev))byCD[k].clin+=h;else byCD[k].anc+=h;
      if(!cnames[cid]){var cl=DATA.clients.find(function(c){return c.id===cid;});cnames[cid]=cl?cl.name||cid:cid;}
    });
  });
  Object.values(byCD).forEach(function(r){r.total=Math.round((r.clin+r.anc)*10)/10;r.clin=Math.round(r.clin*10)/10;r.anc=Math.round(r.anc*10)/10;});

  var weeks=[...allWks].sort();
  if(!weeks.length){el.innerHTML='<div class="card" style="text-align:center;padding:40px;color:#888">No session data.</div>';return;}
  if(_auditWkIdx===0)_auditWkIdx=weeks.length-1;
  if(_auditWkIdx>=weeks.length)_auditWkIdx=weeks.length-1;
  if(_auditWkIdx<0)_auditWkIdx=0;

  var allRows=Object.values(byCD);
  var isWeekday=[false,true,true,true,true,true,false];

  // Overall KPIs — weekdays only for compliance
  var wdRows=allRows.filter(function(r){var dow=new Date(r.date+'T12:00:00').getDay();return dow>=1&&dow<=5;});
  var totDays=wdRows.length,metAll=wdRows.filter(function(r){return r.total>=TARGET;}).length;
  var pct=totDays?Math.round(metAll/totDays*100):0;
  el.innerHTML='<div class="krow k4">'+
    kpi(totDays,'Client-Days','All weeks in range')+kpi(metAll,'Met Target (≥'+TARGET+' hrs)','','ck')+
    kpi(totDays-metAll,'Under Target','','cw')+kpi(pct+'%','Overall Compliance','',pct>=80?'ck':'cw')+
  '</div>';

  // Week carousel
  var wkStart=weeks[_auditWkIdx];
  var days=[];
  for(var d=0;d<7;d++){var dt=new Date(wkStart+'T12:00:00');dt.setDate(dt.getDate()+d);days.push(dt.toISOString().slice(0,10));}
  var wkEnd=days[6];
  var wkEntries=Object.values(byCD).filter(function(r){return r.wk===wkStart;});
  var lookup={};wkEntries.forEach(function(r){lookup[r.id+'|'+r.date]={clin:r.clin,anc:r.anc,total:r.total};});
  var clientIds=[...new Set(wkEntries.map(function(r){return r.id;}))].sort(function(a,b){return(cnames[a]||'').localeCompare(cnames[b]||'');});

  var wkPct=0;if(clientIds.length){
    var wkMet=clientIds.filter(function(cid){
      var wdH=0,wdD=0,weH=0;
      days.forEach(function(day,di){
        var h=(lookup[cid+'|'+day]||{total:0}).total||0;
        if(isWeekday[di]){wdH+=h;if(h>0)wdD++;}else weH+=h;
      });
      // Met if weekday+weekend total covers weekday target
      return wdD>0&&(wdH+weH)>=(wdD*TARGET);
    }).length;
    wkPct=Math.round(wkMet/clientIds.length*100);
  }

  var wkLbl=moLbl(wkStart.slice(0,7))+' '+parseInt(wkStart.slice(8),10)+' – '+moLbl(wkEnd.slice(0,7))+' '+parseInt(wkEnd.slice(8),10)+', '+wkEnd.slice(0,4);
  var card=document.createElement('div');card.className='card';
  var prevDis=_auditWkIdx===0?'opacity:.3;pointer-events:none;':'cursor:pointer;';
  var nextDis=_auditWkIdx===weeks.length-1?'opacity:.3;pointer-events:none;':'cursor:pointer;';

  var dayLabels=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var tbl='<table><thead><tr><th style="min-width:140px">Client</th>'+
    days.map(function(day,di){
      var bg=isWeekday[di]?'#1B2A4A':'#4A6A84';
      var dt2=new Date(day+'T12:00:00');
      return '<th class="r" style="min-width:80px;background:'+bg+'">'+dayLabels[di]+'<br><span style="font-size:8px;font-weight:400">'+(dt2.getMonth()+1)+'/'+dt2.getDate()+'</span>'+(isWeekday[di]?'':' <span style="font-size:8px;opacity:.7">WE</span>')+'</th>';
    }).join('')+
    '<th class="r">Total</th><th>Status</th></tr>'+
    '<tr style="background:#F5F0E8"><td style="font-size:9px;color:#888;padding:3px 10px">Client</td>'+
    days.map(function(){return '<td class="r" style="font-size:9px;color:#888;padding:3px 6px">Clin / Anc / Tot</td>';}).join('')+
    '<td></td><td></td></tr></thead><tbody>';

  clientIds.forEach(function(cid){
    var name=cnames[cid]||cid,wkClin=0,wkAnc=0,wkTotal=0,wdHrs=0,wdDays=0;
    var cells=days.map(function(day,di){
      var rec=lookup[cid+'|'+day]||{clin:0,anc:0,total:0};
      var c=rec.clin||0,a=rec.anc||0,t=Math.round((c+a)*10)/10;
      wkClin+=c;wkAnc+=a;wkTotal+=t;
      if(isWeekday[di]&&t>0){wdHrs+=t;wdDays++;}
      // Weekends: show hours but no target color coding
      var isWd=isWeekday[di];
      var bg=t===0?'':(isWd?(t>=TARGET?'#E8F5E9':t>TARGET?'#EFF6FF':'#FFFBEB'):'#F5F5F0');
      var tcol=t===0?'#CCC':(isWd?(t>=TARGET?'#2D6A4F':t>TARGET?'#1A56DB':'#D97706'):'#888');
      var inner=t===0?'<span style="color:#CCC">—</span>':
        '<span style="font-size:9px;color:#555">'+Math.round(c*10)/10+'</span><span style="font-size:9px;color:#aaa"> / </span><span style="font-size:9px;color:#888">'+Math.round(a*10)/10+'</span><br><b style="color:'+tcol+'">'+t+'h</b>';
      return '<td class="r" style="background:'+bg+';vertical-align:middle;padding:4px 6px'+(isWd?'':';border-left:2px dashed #E5E2DE')+'">'+inner+'</td>';
    });
    // Compliance: weekdays only — weekend hrs can fill weekday gaps
    var wdNeeded=wdDays*TARGET;
    var weHrsTotal=days.reduce(function(s,day,di){return s+(!isWeekday[di]?((lookup[cid+'|'+day]||{total:0}).total||0):0);},0);
    var hasWE=weHrsTotal>0;
    var effectiveTotal=wdHrs+weHrsTotal; // weekday hrs + weekend supplement
    var deficit=Math.round((wdNeeded-effectiveTotal)*10)/10;
    var status=!wdDays?'<span style="color:#ccc;font-size:11px">No sessions</span>':
      effectiveTotal>=wdNeeded?'<span class="badge bk">✓ Met</span>'+(hasWE&&wdHrs<wdNeeded?' <span style="font-size:9px;color:#888">WE filled gap</span>':''):
      '<span class="badge bam">⬇ '+deficit+'h short</span>';
    wkClin=Math.round(wkClin*10)/10;wkAnc=Math.round(wkAnc*10)/10;wkTotal=Math.round(wkTotal*10)/10;
    tbl+='<tr><td><b>'+name+'</b><div style="font-size:9px;color:#888;margin-top:1px"><span style="color:#1B2A4A">'+wkClin+'h clin</span> · <span style="color:#2D6A4F">'+wkAnc+'h anc</span></div></td>'+
      cells.join('')+'<td class="r"><b>'+wkTotal+'h</b></td><td>'+status+'</td></tr>';
  });

  tbl+='<tr style="background:#F5F0E8"><td><b>Day Total</b></td>'+
    days.map(function(day,di){
      var t=clientIds.reduce(function(s,cid){return s+((lookup[cid+'|'+day]||{total:0}).total||0);},0);
      return '<td class="r" style="background:'+(isWeekday[di]?'#F5F0E8':'#EDE8DF')+'"><b>'+Math.round(t*10)/10+'h</b></td>';
    }).join('')+'<td></td><td></td></tr></tbody></table>';

  card.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
    '<button onclick="_auditWkIdx--;render()" style="padding:6px 18px;border:1.5px solid #E5E2DE;border-radius:6px;background:#fff;font-size:14px;font-weight:700;'+prevDis+'">←</button>'+
    '<div style="text-align:center"><div style="font-size:14px;font-weight:700;color:#1B2A4A">'+wkLbl+'</div>'+
    '<div style="font-size:11px;color:#888;margin-top:3px">Week '+(_auditWkIdx+1)+' of '+weeks.length+' &nbsp;·&nbsp; Target: 5 hrs/day Mon–Fri · Weekend counts toward weekly total &nbsp;·&nbsp; '+wkPct+'% compliance</div></div>'+
    '<button onclick="_auditWkIdx++;render()" style="padding:6px 18px;border:1.5px solid #E5E2DE;border-radius:6px;background:#fff;font-size:14px;font-weight:700;'+nextDis+'">→</button></div>'+
    (clientIds.length?'<div style="overflow-x:auto">'+tbl+'</div>':'<div style="text-align:center;color:#888;padding:20px">No sessions this week.</div>')+
    '<div style="margin-top:10px;font-size:10px;color:#888;display:flex;gap:16px;flex-wrap:wrap">'+
    '<span>Cell: <b>Clin / Anc / Total</b></span>'+
    '<span style="color:#2D6A4F">■ Green ≥5h</span><span style="color:#1A56DB">■ Blue &gt;5h</span><span style="color:#D97706">■ Amber &lt;5h</span>'+
    '<span>WE = Weekend (supplementary)</span></div>';
  el.appendChild(card);
}

/* ══ PROVIDER ROSTER ════════════════════════════════════════ */
function renderRoster(el,evs){
  var byP={};
  evs.forEach(function(ev){
    var p=ev.provider,h=getHrs(ev);
    if(!byP[p])byP[p]={clin:0,anc:0,mos:new Set(),clients:new Set(),svcs:new Set()};
    if(isClin(ev))byP[p].clin+=h;else byP[p].anc+=h;
    byP[p].mos.add(moKey(ev.date));
    if(ev.clientId)byP[p].clients.add(ev.clientId);
    if(ev.service)byP[p].svcs.add(ev.service);
  });
  var rows=Object.entries(byP).sort(function(a,b){return(b[1].clin+b[1].anc)-(a[1].clin+a[1].anc);});
  var unk=rows.filter(function(r){return emp(r[0])==='Unknown';}).length;

  var note=document.createElement('div');
  note.style.cssText='background:#FEF3C7;border-left:3px solid #D97706;padding:10px 14px;border-radius:0 6px 6px 0;font-size:11px;color:#92400E;margin-bottom:14px;line-height:1.6';
  note.innerHTML='<b>Master Provider Roster</b> — all providers with completed sessions. Providers marked <b>Unknown</b> need classification.';
  el.appendChild(note);

  el.innerHTML+='<div class="krow k3">'+
    kpi(rows.length,'Total Providers','With ≥1 completed session')+
    kpi(rows.filter(function(r){return emp(r[0])!=='Unknown';}).length,'Classified','W2 or Contractor confirmed')+
    kpi(unk,'Unclassified',unk?'Need confirmation':'All confirmed',unk?'cw':'ck')+
  '</div>';

  var tbl=document.createElement('div');tbl.className='card';
  tbl.innerHTML='<div class="ct">All Providers</div><div style="overflow-x:auto"><table><thead><tr>'+
    '<th>Provider</th><th>Employment</th><th>Category</th><th class="r">Clin Hrs</th><th class="r">Anc Hrs</th>'+
    '<th class="r">Total Hrs</th><th class="r">Months</th><th class="r">Clients</th><th>Services</th></tr></thead><tbody>'+
    rows.map(function(kv){
      var r=kv[1],p=kv[0],e=emp(p);
      var cat=r.clin>0&&r.anc===0?'<span class="badge bc">Clinician</span>':
               r.clin===0?'<span class="badge ba">Ancillary</span>':
               '<span class="badge bc">Clin</span> <span class="badge ba">+Anc</span>';
      var ebadge=e==='W2'?'<span class="badge bw2">W2</span>':
                 e==='Contractor'?'<span class="badge bctr">1099</span>':
                 '<span class="badge" style="background:#FFE4E1;color:#9B1C1C">Unknown</span>';
      var svcs=[...r.svcs].slice(0,3).join(', ')+(r.svcs.size>3?' +'+( r.svcs.size-3)+' more':'');
      return '<tr><td><b>'+p+'</b></td><td>'+ebadge+'</td><td>'+cat+'</td>'+
        '<td class="r">'+(r.clin?Math.round(r.clin*10)/10:'<span class="z">—</span>')+'</td>'+
        '<td class="r">'+(r.anc?Math.round(r.anc*10)/10:'<span class="z">—</span>')+'</td>'+
        '<td class="r"><b>'+Math.round((r.clin+r.anc)*10)/10+'</b></td>'+
        '<td class="r">'+r.mos.size+'</td><td class="r">'+r.clients.size+'</td>'+
        '<td style="font-size:10px;color:#888">'+svcs+'</td></tr>';}).join('')+
    '</tbody></table></div>';
  el.appendChild(tbl);
}

/* ── Export ─────────────────────────────────────────────────── */
function exportCSV(){
  var evs=getEvs();
  var rows=[['Date','Provider','Employment','Client ID','Service','Category','Hours','Status']];
  evs.forEach(function(ev){rows.push([ev.date,ev.provider||'',emp(ev.provider),ev.clientId||'',ev.service||'',isClin(ev)?'Clinician':'Ancillary',getHrs(ev),ev.status||'']);});
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='ClinicalHours_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
