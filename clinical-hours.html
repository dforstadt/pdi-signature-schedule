<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinical Hours — Premier Signature Program</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F5F0E8;color:#1E1E1E;min-height:100vh}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1B2A4A}
.login-box{background:#fff;border-radius:16px;padding:40px;width:360px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.login-box h1{font-size:20px;color:#1B2A4A;margin-bottom:6px}
.login-box p{font-size:12px;color:#888;margin-bottom:24px}
.login-box input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px}
.login-box button{width:100%;padding:11px;background:#1B2A4A;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
#err-msg{color:#c00;font-size:12px;margin-top:8px;min-height:16px}
#app{display:none}
.top-bar{background:#1B2A4A;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.top-bar h1{font-size:16px;font-weight:700}
.top-bar .sub{font-size:11px;color:#A0B0C8;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block;margin-right:6px}
.dot.on{background:#4ade80}
.controls{background:#fff;border-bottom:1px solid #E5E2DE;padding:12px 24px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.ctrl-group label{display:block;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.controls select,.controls input[type=month]{padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:12px;background:#fff;min-width:130px}
.btn-sm{padding:7px 16px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer}
.btn-primary{background:#1B2A4A;color:#fff}
.btn-outline{background:#fff;border:1px solid #C8C4BE;color:#555}
.main{padding:20px 24px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:800px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border-radius:10px;border:1px solid #E5E2DE;padding:16px 14px;text-align:center}
.kpi .num{font-size:32px;font-weight:700;color:#1B2A4A;line-height:1.1}
.kpi .lbl{font-size:10px;font-weight:700;color:#7A6A56;text-transform:uppercase;letter-spacing:.05em;margin-top:5px}
.kpi .note{font-size:10px;color:#AAA;margin-top:3px}
.card{background:#fff;border-radius:12px;border:1px solid #E5E2DE;padding:20px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:700;color:#7A6A56;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.chart-wrap{position:relative}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.row2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:#fff;background:#1B2A4A;text-transform:uppercase;letter-spacing:.04em}
th.r{text-align:right}
td{padding:7px 10px;border-bottom:.5px solid #F0EDE8;vertical-align:middle}
td.r{text-align:right;font-variant-numeric:tabular-nums;font-family:monospace}
tr:last-child td{border-bottom:none}
tr.sub td{background:#FAFAF8}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:#EEF4FB;color:#1A3A5C}
.zero{color:#DDD}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div style="font-size:36px;margin-bottom:12px">⏱</div>
    <h1>Clinical Hours</h1>
    <p>Premier Signature Program · Lifeskills Behavioral Health<br>Leadership access only</p>
    <input type="password" id="pw" placeholder="Access code" autocomplete="off"
      onkeydown="if(event.key==='Enter')tryLogin()">
    <button onclick="tryLogin()">Access Report</button>
    <div id="err-msg"></div>
  </div>
</div>

<div id="app">
  <div class="top-bar">
    <div>
      <h1>Clinical Hours — Premier Signature Program</h1>
      <div class="sub">
        <span class="dot" id="live-dot"></span>
        <span id="live-lbl">Connecting…</span>
        &nbsp;·&nbsp;Completed sessions only — all programs from launch
      </div>
    </div>
    <a href="/index.html" style="color:#A0B0C8;font-size:12px;text-decoration:none">← Calendar</a>
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <label>View</label>
      <select id="view" onchange="render()">
        <option value="monthly">Monthly</option>
        <option value="weekly">Weekly</option>
        <option value="provider">By Provider</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>From</label>
      <input type="month" id="flt-from" value="2026-04" onchange="render()">
    </div>
    <div class="ctrl-group">
      <label>To</label>
      <input type="month" id="flt-to" onchange="render()">
    </div>
    <div class="ctrl-group">
      <label>Program</label>
      <select id="flt-prog" onchange="render()">
        <option value="">All Programs</option>
        <option value="Signature">Signature</option>
        <option value="PDI">PDI</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label>Provider</label>
      <select id="flt-prov" onchange="render()">
        <option value="">All Providers</option>
      </select>
    </div>
    <div style="margin-left:auto">
      <button class="btn-sm btn-primary" onclick="exportCSV()">↓ CSV</button>
    </div>
  </div>

  <div class="main" id="loading-div" style="text-align:center;padding:60px;color:#888">
    Loading data from Firebase…
  </div>
  <div class="main" id="content" style="display:none"></div>
</div>

<script>
const PW_HASH = 'ClinicalHours2026';
var DATA = {events:[], clients:[], providers:{}};
var _loaded = false;

/* ── Auth ─────────────────────────────────────────────── */
function tryLogin(){
  var v = (document.getElementById('pw').value||'').trim();
  if(v === PW_HASH){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    initFB();
  } else {
    document.getElementById('err-msg').textContent='Incorrect access code.';
    setTimeout(function(){document.getElementById('err-msg').textContent='';}, 2500);
  }
}

/* ── Firebase ─────────────────────────────────────────── */
function initFB(){
  firebase.initializeApp({
    databaseURL:'https://pdi-signature-schedule-default-rtdb.firebaseio.com'
  });
  firebase.database().ref('schedule_v3').on('value', function(snap){
    var raw = snap.val();
    if(raw && raw.blob){
      try{
        var d = JSON.parse(raw.blob);
        if(Array.isArray(d.events))   DATA.events    = d.events;
        if(Array.isArray(d.clients))  DATA.clients   = d.clients;
        if(d.providers)               DATA.providers = d.providers;
      }catch(e){ console.error(e); }
    }
    document.getElementById('live-dot').className = 'dot on';
    document.getElementById('live-lbl').textContent = 'Live';
    _loaded = true;

    // Set default to-month = now
    var now = new Date();
    document.getElementById('flt-to').value =
      now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');

    // Populate provider filter
    var provs = [...new Set(DATA.events.map(function(e){return e.provider||'';}).filter(Boolean))].sort();
    var sel = document.getElementById('flt-prov');
    provs.forEach(function(p){
      var o = document.createElement('option'); o.value=o.textContent=p; sel.appendChild(o);
    });

    document.getElementById('loading-div').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    render();
  });
}

/* ── Helpers ──────────────────────────────────────────── */
function isCompleted(ev){ return (ev.status||'').toLowerCase()==='completed'; }
function isGroup(ev){ return (ev.service||'').toLowerCase().indexOf('group')>-1; }
function isBillable(ev){ return isCompleted(ev) && !isGroup(ev); }
function moKey(d){ return (d||'').slice(0,7); }
function wkKey(d){
  // Sunday-based week key
  var dt = new Date((d||'').slice(0,10)+'T12:00:00');
  if(isNaN(dt)) return '';
  dt.setDate(dt.getDate() - dt.getDay());
  return dt.toISOString().slice(0,10);
}
function moLabel(k){
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var p = k.split('-');
  return months[parseInt(p[1],10)-1]+' '+p[0];
}
function wkLabel(k){
  var dt = new Date(k+'T12:00:00');
  var end = new Date(k+'T12:00:00'); end.setDate(end.getDate()+6);
  return (dt.getMonth()+1)+'/'+dt.getDate()+' – '+(end.getMonth()+1)+'/'+end.getDate();
}

/* ── Filter events ────────────────────────────────────── */
function filteredEvents(){
  var from = document.getElementById('flt-from').value;
  var to   = document.getElementById('flt-to').value;
  var prog = document.getElementById('flt-prog').value;
  var prov = document.getElementById('flt-prov').value;
  return DATA.events.filter(function(ev){
    if(!ev.date || !ev.provider) return false;
    if(!isBillable(ev)) return false;
    var mo = moKey(ev.date);
    if(from && mo < from) return false;
    if(to   && mo > to)   return false;
    if(prov && ev.provider !== prov) return false;
    if(prog){
      var p = (ev.program||'').toLowerCase();
      if(prog==='Signature' && p!=='signature' && p!=='sig' && p!=='both') return false;
      if(prog==='PDI'       && p!=='pdi'       && p!=='both') return false;
    }
    return true;
  });
}

/* ── Chart palette ────────────────────────────────────── */
var PALETTE = [
  '#1B2A4A','#7A6A56','#2D6A4F','#6B2737','#4A235A',
  '#0A4F6E','#78350F','#1E3A5F','#3D1A6F','#065F46',
  '#831843','#1C4532','#374151','#7C3AED','#B45309'
];

/* ── KPI row ──────────────────────────────────────────── */
function kpi(val, lbl, note){
  return '<div class="kpi"><div class="num">'+val+'</div><div class="lbl">'+lbl+'</div>'+
    (note?'<div class="note">'+note+'</div>':'')+
  '</div>';
}

/* ── Render ───────────────────────────────────────────── */
var _charts = [];
function destroyCharts(){ _charts.forEach(function(c){try{c.destroy();}catch(e){}}); _charts=[]; }

function render(){
  if(!_loaded) return;
  destroyCharts();
  var view = document.getElementById('view').value;
  if(view==='monthly')  renderMonthly();
  else if(view==='weekly') renderWeekly();
  else renderProvider();
}

/* ══════════════════════════════════════════════════════
   MONTHLY VIEW
══════════════════════════════════════════════════════ */
function renderMonthly(){
  var evs = filteredEvents();
  var byMo={}, allMo=new Set(), allProv=new Set();
  evs.forEach(function(ev){
    var mo=moKey(ev.date), p=ev.provider;
    allMo.add(mo); allProv.add(p);
    if(!byMo[mo])byMo[mo]={total:0, provs:{}};
    byMo[mo].total++;
    byMo[mo].provs[p]=(byMo[mo].provs[p]||0)+1;
  });
  var months=[...allMo].sort();
  var provs=[...allProv].sort(function(a,b){
    var ta=months.reduce(function(s,m){return s+(byMo[m]&&byMo[m].provs[a]?byMo[m].provs[a]:0);},0);
    var tb=months.reduce(function(s,m){return s+(byMo[m]&&byMo[m].provs[b]?byMo[m].provs[b]:0);},0);
    return tb-ta;
  });

  // KPIs
  var totalSess=evs.length;
  var uniqueClients=new Set(evs.filter(function(e){return e.clientId;}).map(function(e){return e.clientId;})).size;
  var topProv=provs[0]||'—';
  var topProvSess=provs.length?months.reduce(function(s,m){return s+(byMo[m]&&byMo[m].provs[provs[0]]?byMo[m].provs[provs[0]]:0);},0):0;

  var html='<div class="kpi-row">'+
    kpi(totalSess.toLocaleString(),'Completed Sessions','All providers · filtered period')+
    kpi(months.length,'Months','In selected range')+
    kpi(provs.length,'Providers','With ≥1 completed session')+
    kpi(uniqueClients,'Unique Clients','Across all sessions')+
  '</div>';

  // Chart 1: stacked bar by provider per month
  html+='<div class="card"><div class="card-title">Sessions per Month — by Provider (stacked)</div>'+
    '<div class="chart-wrap" style="height:300px"><canvas id="ch-mo-stacked"></canvas></div></div>';

  // Chart 2: row of two — total line + top providers
  html+='<div class="row2">'+
    '<div class="card"><div class="card-title">Total Sessions per Month</div>'+
    '<div class="chart-wrap" style="height:220px"><canvas id="ch-mo-line"></canvas></div></div>'+
    '<div class="card"><div class="card-title">Sessions by Provider — Full Period</div>'+
    '<div class="chart-wrap" style="height:220px"><canvas id="ch-prov-doughnut"></canvas></div></div>'+
  '</div>';

  // Table
  html+='<div class="card"><div class="card-title">Monthly Detail — Completed Sessions by Provider</div>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>Provider</th>'+
    months.map(function(m){return '<th class="r">'+moLabel(m)+'</th>';}).join('')+
    '<th class="r">Total</th></tr></thead><tbody>';
  provs.forEach(function(p){
    var tot=0;
    html+='<tr><td>'+p+'</td>'+months.map(function(m){
      var v=(byMo[m]&&byMo[m].provs[p])||0;
      tot+=v;
      return '<td class="r">'+(v?v:'<span class="zero">—</span>')+'</td>';
    }).join('')+'<td class="r"><b>'+tot+'</b></td></tr>';
  });
  // Totals row
  html+='<tr class="sub"><td><b>Total</b></td>'+months.map(function(m){
    return '<td class="r"><b>'+((byMo[m]&&byMo[m].total)||0)+'</b></td>';
  }).join('')+'<td class="r"><b>'+totalSess+'</b></td></tr>';
  html+='</tbody></table></div></div>';

  document.getElementById('content').innerHTML=html;

  // Build charts
  setTimeout(function(){
    // Stacked bar
    var datasets=provs.slice(0,12).map(function(p,pi){
      return{
        label:p,
        data:months.map(function(m){return(byMo[m]&&byMo[m].provs[p])||0;}),
        backgroundColor:PALETTE[pi%PALETTE.length],
        borderRadius:2, borderSkipped:false
      };
    });
    _charts.push(new Chart(document.getElementById('ch-mo-stacked'),{
      type:'bar',
      data:{labels:months.map(moLabel), datasets:datasets},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:12}}},
        scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,title:{display:true,text:'Sessions'}}}}
    }));

    // Total line
    _charts.push(new Chart(document.getElementById('ch-mo-line'),{
      type:'line',
      data:{labels:months.map(moLabel),datasets:[{
        label:'Sessions',data:months.map(function(m){return(byMo[m]&&byMo[m].total)||0;}),
        borderColor:'#1B2A4A',backgroundColor:'#1B2A4A22',tension:.3,pointRadius:4,fill:true
      }]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{y:{beginAtZero:true,title:{display:true,text:'Sessions'}},x:{grid:{display:false}}}}
    }));

    // Doughnut
    var provTotals=provs.map(function(p){
      return months.reduce(function(s,m){return s+(byMo[m]&&byMo[m].provs[p]?byMo[m].provs[p]:0);},0);
    });
    _charts.push(new Chart(document.getElementById('ch-prov-doughnut'),{
      type:'doughnut',
      data:{labels:provs,datasets:[{
        data:provTotals,backgroundColor:PALETTE.slice(0,provs.length),borderWidth:2,borderColor:'#fff'
      }]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:12,padding:6}}}}
    }));
  },60);
}

/* ══════════════════════════════════════════════════════
   WEEKLY VIEW
══════════════════════════════════════════════════════ */
function renderWeekly(){
  var evs = filteredEvents();
  var byWk={}, allWk=new Set(), allProv=new Set();
  evs.forEach(function(ev){
    var wk=wkKey(ev.date), p=ev.provider;
    if(!wk) return;
    allWk.add(wk); allProv.add(p);
    if(!byWk[wk])byWk[wk]={total:0,provs:{}};
    byWk[wk].total++;
    byWk[wk].provs[p]=(byWk[wk].provs[p]||0)+1;
  });
  var weeks=[...allWk].sort();
  var provs=[...allProv].sort(function(a,b){
    var ta=weeks.reduce(function(s,w){return s+(byWk[w]&&byWk[w].provs[a]?byWk[w].provs[a]:0);},0);
    var tb=weeks.reduce(function(s,w){return s+(byWk[w]&&byWk[w].provs[b]?byWk[w].provs[b]:0);},0);
    return tb-ta;
  });

  var totalSess=evs.length;
  var avgWk=weeks.length?Math.round(totalSess/weeks.length):0;

  var html='<div class="kpi-row">'+
    kpi(totalSess.toLocaleString(),'Completed Sessions','Filtered period')+
    kpi(weeks.length,'Billing Weeks','In selected range')+
    kpi(avgWk,'Avg Sessions/Week','')+
    kpi(provs.length,'Active Providers','')+
  '</div>';

  // Chart: weekly totals bar
  html+='<div class="card"><div class="card-title">Weekly Session Count — All Providers</div>'+
    '<div class="chart-wrap" style="height:260px"><canvas id="ch-wk-bar"></canvas></div></div>';

  // Chart 2: top providers weekly heatmap-style line
  html+='<div class="card"><div class="card-title">Weekly Sessions — Top Providers</div>'+
    '<div class="chart-wrap" style="height:260px"><canvas id="ch-wk-line"></canvas></div></div>';

  // Weekly table (most recent 12 weeks)
  var recentWks=weeks.slice(-12);
  html+='<div class="card"><div class="card-title">Weekly Detail — Most Recent 12 Weeks</div>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>Provider</th>'+
    recentWks.map(function(w){return '<th class="r">'+wkLabel(w)+'</th>';}).join('')+
    '<th class="r">Total</th></tr></thead><tbody>';
  provs.forEach(function(p){
    var rowTotal=0;
    var cells=recentWks.map(function(w){
      var v=(byWk[w]&&byWk[w].provs[p])||0; rowTotal+=v;
      return '<td class="r">'+(v?v:'<span class="zero">—</span>')+'</td>';
    }).join('');
    if(rowTotal>0)
      html+='<tr><td>'+p+'</td>'+cells+'<td class="r"><b>'+rowTotal+'</b></td></tr>';
  });
  html+='</tbody></table></div></div>';

  document.getElementById('content').innerHTML=html;

  setTimeout(function(){
    // Weekly bar
    var labels=weeks.map(wkLabel);
    _charts.push(new Chart(document.getElementById('ch-wk-bar'),{
      type:'bar',
      data:{labels:labels,datasets:[{
        label:'Sessions',data:weeks.map(function(w){return(byWk[w]&&byWk[w].total)||0;}),
        backgroundColor:'#1B2A4A',borderRadius:3
      }]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{display:false},ticks:{maxRotation:45,font:{size:9}}},
          y:{beginAtZero:true,title:{display:true,text:'Sessions'}}}}
    }));

    // Top 6 providers line
    var top6=provs.slice(0,6);
    _charts.push(new Chart(document.getElementById('ch-wk-line'),{
      type:'line',
      data:{labels:labels,datasets:top6.map(function(p,pi){
        return{label:p,
          data:weeks.map(function(w){return(byWk[w]&&byWk[w].provs[p])||0;}),
          borderColor:PALETTE[pi],backgroundColor:'transparent',tension:.2,pointRadius:2,borderWidth:2};
      })},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:12}}},
        scales:{x:{grid:{display:false},ticks:{maxRotation:45,font:{size:9}}},
          y:{beginAtZero:true,title:{display:true,text:'Sessions'}}}}
    }));
  },60);
}

/* ══════════════════════════════════════════════════════
   BY PROVIDER VIEW
══════════════════════════════════════════════════════ */
function renderProvider(){
  var evs = filteredEvents();
  var byProv={};
  evs.forEach(function(ev){
    var p=ev.provider;
    if(!byProv[p])byProv[p]={sessions:0,months:new Set(),clients:new Set(),weeks:new Set(),
      bySig:0,byPDI:0,moData:{}};
    byProv[p].sessions++;
    var mo=moKey(ev.date);
    byProv[p].months.add(mo);
    byProv[p].weeks.add(wkKey(ev.date));
    if(ev.clientId)byProv[p].clients.add(ev.clientId);
    var prog=(ev.program||'').toLowerCase();
    if(prog==='signature'||prog==='sig')byProv[p].bySig++;
    else if(prog==='pdi')byProv[p].byPDI++;
    byProv[p].moData[mo]=(byProv[p].moData[mo]||0)+1;
  });

  var provs=Object.entries(byProv).sort(function(a,b){return b[1].sessions-a[1].sessions;});

  var html='<div class="kpi-row">'+
    kpi(provs.length,'Providers','With sessions in period')+
    kpi(evs.length.toLocaleString(),'Total Sessions','')+
    kpi(provs.length?provs[0][0]:'—','Top Provider',provs.length?provs[0][1].sessions+' sessions':'')+
    kpi(provs.length?Math.round(evs.length/provs.length):0,'Avg Sessions/Provider','')+
  '</div>';

  // Horizontal bar
  html+='<div class="card"><div class="card-title">Total Completed Sessions by Provider</div>'+
    '<div class="chart-wrap" style="height:'+(Math.max(280,provs.length*28))+'px">'+
    '<canvas id="ch-prov-bar"></canvas></div></div>';

  // Sig vs PDI split
  html+='<div class="row2">'+
    '<div class="card"><div class="card-title">Signature vs PDI Sessions by Provider</div>'+
    '<div class="chart-wrap" style="height:260px"><canvas id="ch-prov-split"></canvas></div></div>'+
    '<div class="card"><div class="card-title">Sessions per Active Month — Provider Average</div>'+
    '<div class="chart-wrap" style="height:260px"><canvas id="ch-prov-rate"></canvas></div></div>'+
  '</div>';

  // Table
  html+='<div class="card"><div class="card-title">Provider Detail — Full Period</div>'+
    '<div style="overflow-x:auto"><table><thead><tr>'+
    '<th>Provider</th><th class="r">Sessions</th><th class="r">Sig</th><th class="r">PDI</th>'+
    '<th class="r">Active Months</th><th class="r">Active Weeks</th>'+
    '<th class="r">Unique Clients</th><th class="r">Avg/Month</th></tr></thead><tbody>'+
    provs.map(function(kv){
      var r=kv[1];
      return '<tr>'+
        '<td><b>'+kv[0]+'</b></td>'+
        '<td class="r"><b>'+r.sessions+'</b></td>'+
        '<td class="r">'+(r.bySig||'—')+'</td>'+
        '<td class="r">'+(r.byPDI||'—')+'</td>'+
        '<td class="r">'+r.months.size+'</td>'+
        '<td class="r">'+r.weeks.size+'</td>'+
        '<td class="r">'+r.clients.size+'</td>'+
        '<td class="r">'+(r.months.size?Math.round(r.sessions/r.months.size):r.sessions)+'</td>'+
      '</tr>';
    }).join('')+
    '</tbody></table></div></div>';

  document.getElementById('content').innerHTML=html;

  setTimeout(function(){
    var labels=provs.map(function(p){return p[0];});
    var vals=provs.map(function(p){return p[1].sessions;});

    // Horizontal bar
    _charts.push(new Chart(document.getElementById('ch-prov-bar'),{
      type:'bar',
      data:{labels:labels,datasets:[{
        label:'Sessions',data:vals,backgroundColor:'#1B2A4A',borderRadius:3
      }]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
        plugins:{legend:{display:false}},
        scales:{x:{beginAtZero:true,title:{display:true,text:'Completed Sessions'}},
          y:{grid:{display:false}}}}
    }));

    // Stacked Sig/PDI
    _charts.push(new Chart(document.getElementById('ch-prov-split'),{
      type:'bar',
      data:{labels:labels,datasets:[
        {label:'Signature',data:provs.map(function(p){return p[1].bySig||0;}),backgroundColor:'#1B2A4A',borderRadius:2},
        {label:'PDI',data:provs.map(function(p){return p[1].byPDI||0;}),backgroundColor:'#7A6A56',borderRadius:2}
      ]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
        plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:12}}},
        scales:{x:{stacked:true,beginAtZero:true},y:{stacked:true,grid:{display:false}}}}
    }));

    // Rate
    var rates=provs.map(function(p){
      return p[1].months.size?Math.round(p[1].sessions/p[1].months.size):p[1].sessions;
    });
    _charts.push(new Chart(document.getElementById('ch-prov-rate'),{
      type:'bar',
      data:{labels:labels,datasets:[{
        label:'Avg sessions/month',data:rates,backgroundColor:'#2D6A4F',borderRadius:3
      }]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
        plugins:{legend:{display:false}},
        scales:{x:{beginAtZero:true,title:{display:true,text:'Sessions/Month'}},y:{grid:{display:false}}}}
    }));
  },60);
}

/* ── Export ───────────────────────────────────────────── */
function exportCSV(){
  var evs=filteredEvents();
  var rows=[['Date','Week','Month','Provider','Client ID','Program','Service','Status']];
  evs.forEach(function(ev){
    rows.push([ev.date,wkKey(ev.date),moKey(ev.date),ev.provider||'',ev.clientId||'',ev.program||'',ev.service||'',ev.status||'']);
  });
  var csv=rows.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='Clinical_Hours_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}
</script>
