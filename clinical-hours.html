<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinical Hours — Premier Signature Program</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Arial',sans-serif;background:#F5F0E8;color:#1E1E1E;min-height:100vh}
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1B2A4A}
  .login-box{background:#fff;border-radius:16px;padding:40px;width:360px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3)}
  .login-box h1{font-size:20px;color:#1B2A4A;margin-bottom:6px}
  .login-box p{font-size:12px;color:#888;margin-bottom:24px}
  .login-box input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px}
  .login-box button{width:100%;padding:11px;background:#1B2A4A;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
  .login-box button:hover{background:#2A3F5C}
  #err-msg{color:#c00;font-size:12px;margin-top:8px;min-height:16px}
  #app{display:none}
  .top-bar{background:#1B2A4A;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
  .top-bar h1{font-size:16px;font-weight:700}
  .top-bar .sub{font-size:11px;color:#A0B0C8;margin-top:2px}
  .top-bar .dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;margin-right:6px;transition:background .3s}
  .top-bar .dot.on{background:#4ade80}
  .controls{background:#fff;border-bottom:1px solid #E5E2DE;padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .controls select,.controls input{padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:12px;background:#fff}
  .controls label{font-size:11px;font-weight:600;color:#666}
  .btn-sm{padding:7px 16px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer}
  .btn-primary{background:#1B2A4A;color:#fff}
  .btn-outline{background:#fff;border:1px solid #ddd;color:#555}
  .main{padding:20px 24px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
  .card{background:#fff;border-radius:12px;border:1px solid #E5E2DE;padding:20px}
  .card h2{font-size:13px;font-weight:700;color:#7A6A56;text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  @media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:#fff;border-radius:10px;border:1px solid #E5E2DE;padding:16px;text-align:center}
  .kpi .val{font-size:28px;font-weight:700;color:#1B2A4A;line-height:1}
  .kpi .lbl{font-size:10px;color:#888;margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
  .kpi .sub{font-size:11px;color:#7A6A56;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:#1B2A4A;color:#fff;padding:8px 10px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  th.num{text-align:right}
  td{padding:7px 10px;border-bottom:.5px solid #F0EDE8}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:hover td{background:#FAFAF8}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
  .badge-blue{background:#EEF4FB;color:#1A3A5C}
  .badge-green{background:#E8F5E9;color:#2D4A3E}
  .badge-amber{background:#FEF9E7;color:#784212}
  .chart-wrap{position:relative;height:280px}
  .loading{text-align:center;padding:60px;color:#888;font-size:13px}
  .month-header{font-size:11px;font-weight:700;color:#1B2A4A;background:#F5F0E8;padding:6px 10px;text-transform:uppercase;letter-spacing:.05em}
  .prog-row td{background:#FAFAF8;font-weight:600}
  select#view-mode{min-width:140px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div style="font-size:32px;margin-bottom:12px">⏱️</div>
    <h1>Clinical Hours</h1>
    <p>Premier Signature Program · Lifeskills Behavioral Health<br>Leadership access only</p>
    <input type="password" id="pw-input" placeholder="Access code" autocomplete="off" onkeydown="if(event.key==='Enter')tryLogin()">
    <button onclick="tryLogin()">Access Report</button>
    <div id="err-msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="top-bar">
    <div>
      <h1>Clinical Hours Report — Premier Signature Program</h1>
      <div class="sub"><span class="dot" id="live-dot"></span><span id="live-lbl">Connecting…</span> · Lifeskills Behavioral Health · Leadership</div>
    </div>
    <a href="/index.html" style="color:#A0B0C8;font-size:12px;text-decoration:none">← Calendar</a>
  </div>

  <div class="controls">
    <div>
      <label>View</label><br>
      <select id="view-mode" onchange="render()">
        <option value="monthly">Monthly Summary</option>
        <option value="provider">By Provider</option>
        <option value="program">By Program (Sig / PDI)</option>
      </select>
    </div>
    <div>
      <label>From</label><br>
      <input type="month" id="flt-from" value="2026-01" onchange="render()">
    </div>
    <div>
      <label>To</label><br>
      <input type="month" id="flt-to" onchange="render()">
    </div>
    <div>
      <label>Program</label><br>
      <select id="flt-prog" onchange="render()">
        <option value="">All Programs</option>
        <option value="Signature">Signature</option>
        <option value="PDI">PDI</option>
      </select>
    </div>
    <div style="margin-top:16px">
      <button class="btn-sm btn-outline" onclick="render()">↻ Refresh</button>
    </div>
    <div style="margin-left:auto;margin-top:16px">
      <button class="btn-sm btn-primary" onclick="exportCSV()">↓ Export CSV</button>
    </div>
  </div>

  <div class="main" id="loading-div">
    <div class="loading">Loading clinical data from Firebase…</div>
  </div>
  <div class="main" id="main-content" style="display:none"></div>
</div>

<script>
const PW = 'ClinicalHours2026';
const INDIRECT_RATIO = 3.75 / 5; // per Forstadt model: 3.75 indirect per 5 direct hrs

// ── Auth ─────────────────────────────────────────────────────────────────────
function tryLogin(){
  var v=(document.getElementById('pw-input').value||'').trim();
  if(v===PW){document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='block';initFirebase();}
  else{document.getElementById('err-msg').textContent='Incorrect access code.';setTimeout(function(){document.getElementById('err-msg').textContent='';},2500);}
}

// ── Firebase ──────────────────────────────────────────────────────────────────
var DATA={events:[],clients:[],providers:{}};
var _fbLoaded=false;

function initFirebase(){
  firebase.initializeApp({
    apiKey:"AIzaSyD-placeholder",
    databaseURL:"https://pdi-signature-schedule-default-rtdb.firebaseio.com"
  });
  var FB=firebase.database().ref('schedule_v3');
  FB.on('value',function(snap){
    var raw=snap.val();
    if(raw&&raw.blob){
      try{
        var d=JSON.parse(raw.blob);
        if(Array.isArray(d.events))DATA.events=d.events;
        if(Array.isArray(d.clients))DATA.clients=d.clients;
        if(d.providers&&typeof d.providers==='object')DATA.providers=d.providers;
      }catch(e){console.error(e);}
    }
    document.getElementById('live-dot').className='dot on';
    document.getElementById('live-lbl').textContent='Live';
    _fbLoaded=true;
    document.getElementById('loading-div').style.display='none';
    document.getElementById('main-content').style.display='block';
    // Default to-month = current month
    var now=new Date();
    document.getElementById('flt-to').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    render();
  });
}

// ── Core calculation ──────────────────────────────────────────────────────────
function getMonthKey(dateStr){return (dateStr||'').slice(0,7);}
function monthLabel(key){
  var p=key.split('-');
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(p[1],10)-1]+' '+p[0];
}
function isCompleted(ev){return(ev.status||'').toLowerCase()==='completed';}
function isGroup(ev){return (ev.service||'').toLowerCase().indexOf('group')>-1;}

function calcHours(){
  var fltFrom=document.getElementById('flt-from').value; // "2026-01"
  var fltTo=document.getElementById('flt-to').value;
  var fltProg=document.getElementById('flt-prog').value;

  // Build: { month: { provider: { direct, indirect, sessions, clients:Set } } }
  var byMonth={};
  var allMonths=new Set();
  var allProviders=new Set();

  DATA.events.forEach(function(ev){
    if(!ev.date||!ev.provider)return;
    var mo=getMonthKey(ev.date);
    if(fltFrom&&mo<fltFrom)return;
    if(fltTo&&mo>fltTo)return;
    // Program filter
    if(fltProg){
      var prog=(ev.program||'').toLowerCase();
      if(fltProg==='Signature'&&prog!=='signature'&&prog!=='sig'&&prog!=='both')return;
      if(fltProg==='PDI'&&prog!=='pdi'&&prog!=='both')return;
    }
    var prov=(ev.provider||'').trim();
    if(!prov)return;
    allMonths.add(mo);
    allProviders.add(prov);
    if(!byMonth[mo])byMonth[mo]={};
    if(!byMonth[mo][prov])byMonth[mo][prov]={direct:0,indirect:0,sessions:0,groups:0,clients:new Set()};
    var isComp=isCompleted(ev);
    var isGrp=isGroup(ev);
    if(isComp&&!isGrp){
      byMonth[mo][prov].direct+=1; // 1 hr per completed individual session
      byMonth[mo][prov].indirect+=INDIRECT_RATIO;
      byMonth[mo][prov].sessions+=1;
    } else if(isComp&&isGrp){
      byMonth[mo][prov].groups+=1;
      // Groups counted as 1 hr direct, shared across participants
      byMonth[mo][prov].direct+=1;
    }
    if(ev.clientId)byMonth[mo][prov].clients.add(ev.clientId);
  });

  return {byMonth:byMonth, months:[...allMonths].sort(), providers:[...allProviders].sort()};
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  if(!_fbLoaded)return;
  var mode=document.getElementById('view-mode').value;
  var data=calcHours();
  var el=document.getElementById('main-content');
  el.innerHTML='';

  // KPIs
  var totalDirect=0,totalSessions=0,totalProviders=new Set(),totalClients=new Set();
  data.months.forEach(function(mo){
    Object.entries(data.byMonth[mo]||{}).forEach(function(kv){
      totalDirect+=kv[1].direct;
      totalSessions+=kv[1].sessions;
      totalProviders.add(kv[0]);
      kv[1].clients.forEach(function(c){totalClients.add(c);});
    });
  });
  var totalIndirect=Math.round(totalDirect*INDIRECT_RATIO);

  el.innerHTML+='<div class="kpi-grid">'+
    kpiCard(totalSessions,'Direct Sessions','Individual completed sessions')+
    kpiCard(Math.round(totalDirect)+'h','Direct Hrs','@1 hr/session')+
    kpiCard(Math.round(totalIndirect)+'h','Est. Indirect Hrs','Documentation, coordination, meetings')+
    kpiCard(totalProviders.size,'Active Providers','Providers with ≥1 session in range')+
  '</div>';

  if(mode==='monthly') renderMonthly(el, data);
  else if(mode==='provider') renderByProvider(el, data);
  else renderByProgram(el, data);
}

function kpiCard(val,lbl,sub){
  return '<div class="kpi"><div class="val">'+val+'</div><div class="lbl">'+lbl+'</div><div class="sub">'+sub+'</div></div>';
}

// ── Monthly view ──────────────────────────────────────────────────────────────
function renderMonthly(el, data){
  // Chart
  var chartDiv=document.createElement('div');
  chartDiv.className='card';
  chartDiv.style.marginBottom='16px';
  chartDiv.innerHTML='<h2>Monthly Direct Service Hours — All Providers</h2><div class="chart-wrap"><canvas id="chart-monthly"></canvas></div>';
  el.appendChild(chartDiv);

  var labels=data.months.map(monthLabel);
  var directData=data.months.map(function(mo){
    return Object.values(data.byMonth[mo]||{}).reduce(function(s,v){return s+v.direct;},0);
  });
  var indirectData=data.months.map(function(mo){
    return Math.round(Object.values(data.byMonth[mo]||{}).reduce(function(s,v){return s+v.indirect;},0));
  });

  setTimeout(function(){
    new Chart(document.getElementById('chart-monthly'),{
      type:'bar',
      data:{labels:labels,datasets:[
        {label:'Direct Hrs',data:directData,backgroundColor:'#1B2A4A',borderRadius:4},
        {label:'Est. Indirect Hrs',data:indirectData,backgroundColor:'#7A6A56',borderRadius:4}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{stacked:false},y:{beginAtZero:true,title:{display:true,text:'Hours'}}}}
    });
  },50);

  // Provider breakdown chart
  var pChartDiv=document.createElement('div');
  pChartDiv.className='grid-2';
  pChartDiv.innerHTML=
    '<div class="card"><h2>Hours by Provider (Total Period)</h2><div class="chart-wrap"><canvas id="chart-prov"></canvas></div></div>'+
    '<div class="card"><h2>Sessions Trend by Month</h2><div class="chart-wrap"><canvas id="chart-trend"></canvas></div></div>';
  el.appendChild(pChartDiv);

  // Total per provider
  var provTotals={};
  data.months.forEach(function(mo){
    Object.entries(data.byMonth[mo]||{}).forEach(function(kv){
      if(!provTotals[kv[0]])provTotals[kv[0]]=0;
      provTotals[kv[0]]+=kv[1].direct;
    });
  });
  var sortedProvs=Object.entries(provTotals).sort(function(a,b){return b[1]-a[1];});
  var colors=['#1B2A4A','#7A6A56','#2D4A3E','#4A235A','#784212','#1A3A5C','#922B21','#145A32','#0E5A38','#1A5276','#6B2737','#4A4A00'];

  setTimeout(function(){
    new Chart(document.getElementById('chart-prov'),{
      type:'doughnut',
      data:{
        labels:sortedProvs.map(function(p){return p[0];}),
        datasets:[{data:sortedProvs.map(function(p){return Math.round(p[1]);}),backgroundColor:colors,borderWidth:2}]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:12}}}}
    });
    // Trend line per top-5 providers
    var top5=sortedProvs.slice(0,5).map(function(p){return p[0];});
    new Chart(document.getElementById('chart-trend'),{
      type:'line',
      data:{labels:labels,datasets:top5.map(function(prov,pi){
        return{label:prov,data:data.months.map(function(mo){return(data.byMonth[mo]&&data.byMonth[mo][prov])?Math.round(data.byMonth[mo][prov].direct):0;}),
          borderColor:colors[pi],backgroundColor:colors[pi]+'22',tension:.3,pointRadius:3,fill:false};
      })},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:12}}},scales:{y:{beginAtZero:true}}}
    });
  },100);

  // Table
  var tableDiv=document.createElement('div');
  tableDiv.className='card';
  var thead='<thead><tr><th>Month</th><th class="num">Sessions</th><th class="num">Direct Hrs</th><th class="num">Est. Indirect Hrs</th><th class="num">Total Est. Hrs</th><th class="num">Providers Active</th><th class="num">Unique Clients</th></tr></thead>';
  var tbody='<tbody>';
  data.months.forEach(function(mo){
    var rows=Object.values(data.byMonth[mo]||{});
    var sess=rows.reduce(function(s,v){return s+v.sessions;},0);
    var dir=rows.reduce(function(s,v){return s+v.direct;},0);
    var ind=Math.round(dir*INDIRECT_RATIO);
    var clients=new Set();rows.forEach(function(r){r.clients.forEach(function(c){clients.add(c);});});
    tbody+='<tr><td><b>'+monthLabel(mo)+'</b></td>'+
      '<td class="num">'+sess+'</td>'+
      '<td class="num">'+Math.round(dir)+' hrs</td>'+
      '<td class="num">'+ind+' hrs</td>'+
      '<td class="num"><b>'+(Math.round(dir)+ind)+' hrs</b></td>'+
      '<td class="num">'+Object.keys(data.byMonth[mo]||{}).length+'</td>'+
      '<td class="num">'+clients.size+'</td>'+
    '</tr>';
  });
  tbody+='</tbody>';
  tableDiv.innerHTML='<h2>Monthly Detail</h2><div style="overflow-x:auto"><table>'+thead+tbody+'</table></div>';
  el.appendChild(tableDiv);
}

// ── By Provider view ──────────────────────────────────────────────────────────
function renderByProvider(el, data){
  var provTotals={};
  data.months.forEach(function(mo){
    Object.entries(data.byMonth[mo]||{}).forEach(function(kv){
      if(!provTotals[kv[0]])provTotals[kv[0]]={direct:0,indirect:0,sessions:0,months:new Set(),clients:new Set()};
      provTotals[kv[0]].direct+=kv[1].direct;
      provTotals[kv[0]].indirect+=kv[1].indirect;
      provTotals[kv[0]].sessions+=kv[1].sessions;
      provTotals[kv[0]].months.add(mo);
      kv[1].clients.forEach(function(c){provTotals[kv[0]].clients.add(c);});
    });
  });

  // Bar chart
  var sortedProvs=Object.entries(provTotals).sort(function(a,b){return b[1].direct-a[1].direct;});
  var chartDiv=document.createElement('div');
  chartDiv.className='card'; chartDiv.style.marginBottom='16px';
  chartDiv.innerHTML='<h2>Direct Service Hours by Provider — Full Period</h2><div class="chart-wrap" style="height:320px"><canvas id="chart-by-prov"></canvas></div>';
  el.appendChild(chartDiv);

  setTimeout(function(){
    new Chart(document.getElementById('chart-by-prov'),{
      type:'bar',
      data:{
        labels:sortedProvs.map(function(p){return p[0];}),
        datasets:[
          {label:'Direct Hrs',data:sortedProvs.map(function(p){return Math.round(p[1].direct);}),backgroundColor:'#1B2A4A',borderRadius:4},
          {label:'Est. Indirect Hrs',data:sortedProvs.map(function(p){return Math.round(p[1].indirect);}),backgroundColor:'#7A6A56',borderRadius:4}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{position:'bottom'}},scales:{x:{stacked:false,beginAtZero:true,title:{display:true,text:'Hours'}}}}
    });
  },50);

  // Table
  var tableDiv=document.createElement('div');
  tableDiv.className='card';
  var thead='<thead><tr><th>Provider</th><th class="num">Sessions</th><th class="num">Direct Hrs</th><th class="num">Est. Indirect Hrs</th><th class="num">Total Est. Hrs</th><th class="num">Active Months</th><th class="num">Unique Clients</th><th>Type</th></tr></thead>';
  var tbody='<tbody>';
  sortedProvs.forEach(function(kv){
    var pr=DATA.providers[kv[0]]||{};
    var type=pr.stipendType||'Session';
    tbody+='<tr>'+
      '<td><b>'+kv[0]+'</b></td>'+
      '<td class="num">'+kv[1].sessions+'</td>'+
      '<td class="num">'+Math.round(kv[1].direct)+' hrs</td>'+
      '<td class="num">'+Math.round(kv[1].indirect)+' hrs</td>'+
      '<td class="num"><b>'+(Math.round(kv[1].direct)+Math.round(kv[1].indirect))+' hrs</b></td>'+
      '<td class="num">'+kv[1].months.size+'</td>'+
      '<td class="num">'+kv[1].clients.size+'</td>'+
      '<td><span class="badge badge-blue">'+type+'</span></td>'+
    '</tr>';
  });
  tbody+='</tbody>';
  tableDiv.innerHTML='<h2>Provider Detail — Full Period</h2><div style="overflow-x:auto"><table>'+thead+tbody+'</table></div>';
  el.appendChild(tableDiv);

  // Per-provider monthly breakdown
  var detailDiv=document.createElement('div');
  detailDiv.className='card'; detailDiv.style.marginTop='16px';
  var dHtml='<h2>Provider Monthly Breakdown</h2><div style="overflow-x:auto"><table><thead><tr><th>Provider</th>'+
    data.months.map(function(mo){return '<th class="num">'+monthLabel(mo)+'<br><span style="font-weight:400;font-size:9px">Direct / Sessions</span></th>';}).join('')+
    '<th class="num">Total</th></tr></thead><tbody>';
  sortedProvs.forEach(function(kv){
    dHtml+='<tr><td><b>'+kv[0]+'</b></td>'+
      data.months.map(function(mo){
        var r=data.byMonth[mo]&&data.byMonth[mo][kv[0]];
        if(!r||!r.sessions)return '<td class="num" style="color:#ccc">—</td>';
        return '<td class="num">'+Math.round(r.direct)+'h / '+r.sessions+'</td>';
      }).join('')+
      '<td class="num"><b>'+Math.round(kv[1].direct)+'h</b></td></tr>';
  });
  dHtml+='</tbody></table></div>';
  detailDiv.innerHTML=dHtml;
  el.appendChild(detailDiv);
}

// ── By Program view ───────────────────────────────────────────────────────────
function renderByProgram(el, data){
  var sigData={},pdiData={},allData={};
  DATA.events.forEach(function(ev){
    if(!ev.date||!ev.provider||!isCompleted(ev)||isGroup(ev))return;
    var mo=getMonthKey(ev.date);
    var fltFrom=document.getElementById('flt-from').value;
    var fltTo=document.getElementById('flt-to').value;
    if(fltFrom&&mo<fltFrom)return;
    if(fltTo&&mo>fltTo)return;
    var prog=(ev.program||'').toLowerCase();
    var isSig=prog==='signature'||prog==='sig';
    var isPDI=prog==='pdi';
    [allData,isSig?sigData:null,isPDI?pdiData:null].forEach(function(d){
      if(!d)return;
      if(!d[mo])d[mo]={direct:0,sessions:0};
      d[mo].direct+=1; d[mo].sessions+=1;
    });
  });

  var months=data.months;
  var chartDiv=document.createElement('div');
  chartDiv.className='card'; chartDiv.style.marginBottom='16px';
  chartDiv.innerHTML='<h2>Monthly Sessions by Program</h2><div class="chart-wrap"><canvas id="chart-prog"></canvas></div>';
  el.appendChild(chartDiv);

  setTimeout(function(){
    new Chart(document.getElementById('chart-prog'),{
      type:'bar',
      data:{labels:months.map(monthLabel),datasets:[
        {label:'Signature',data:months.map(function(mo){return sigData[mo]?sigData[mo].sessions:0;}),backgroundColor:'#4A235A',borderRadius:4},
        {label:'PDI',data:months.map(function(mo){return pdiData[mo]?pdiData[mo].sessions:0;}),backgroundColor:'#7A6A56',borderRadius:4}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}}}
    });
  },50);

  var tableDiv=document.createElement('div');
  tableDiv.className='card';
  tableDiv.innerHTML='<h2>Program Detail by Month</h2><div style="overflow-x:auto"><table><thead><tr>'+
    '<th>Month</th><th class="num">Sig Sessions</th><th class="num">Sig Direct Hrs</th>'+
    '<th class="num">PDI Sessions</th><th class="num">PDI Direct Hrs</th>'+
    '<th class="num">Total Sessions</th><th class="num">Total Direct Hrs</th></tr></thead><tbody>'+
    months.map(function(mo){
      var s=sigData[mo]||{direct:0,sessions:0};
      var p=pdiData[mo]||{direct:0,sessions:0};
      var a=allData[mo]||{direct:0,sessions:0};
      return '<tr><td><b>'+monthLabel(mo)+'</b></td>'+
        '<td class="num">'+s.sessions+'</td><td class="num">'+Math.round(s.direct)+' hrs</td>'+
        '<td class="num">'+p.sessions+'</td><td class="num">'+Math.round(p.direct)+' hrs</td>'+
        '<td class="num"><b>'+a.sessions+'</b></td><td class="num"><b>'+Math.round(a.direct)+' hrs</b></td>'+
      '</tr>';
    }).join('')+
    '</tbody></table></div>';
  el.appendChild(tableDiv);
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportCSV(){
  var data=calcHours();
  var rows=[['Month','Provider','Sessions','Direct Hrs','Est Indirect Hrs','Total Est Hrs','Unique Clients']];
  data.months.forEach(function(mo){
    Object.entries(data.byMonth[mo]||{}).forEach(function(kv){
      var r=kv[1];
      rows.push([monthLabel(mo),kv[0],r.sessions,Math.round(r.direct),Math.round(r.indirect),Math.round(r.direct+r.indirect),r.clients.size]);
    });
  });
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='Clinical_Hours_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}
</script>
