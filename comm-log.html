<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Communication Log — Lifeskills</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B2A4A;--bg:#F7F5F2;--white:#fff;--tx:#1A1A1A;--tx2:#555544;--tx3:#888877;
  --bd:#E0DDD8;--purple:#7C3AED;--green:#157A52;--amber:#B87A00;--red:#991F10;
  --sig:#6B5C45;--pdi:#4A6C8A;--r:8px;
}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

.hdr{background:var(--navy);padding:0 24px;height:50px;display:flex;align-items:center;gap:12px}
.hdr-title{color:rgba(255,252,245,.9);font-size:15px;font-weight:700}
.nav-link{color:rgba(255,252,245,.65);text-decoration:none;font-size:12px;padding:4px 10px;
  border-radius:5px;border:.5px solid rgba(255,252,245,.15)}
.nav-link:hover{color:#fff;background:rgba(255,252,245,.1)}
.ldot{width:7px;height:7px;border-radius:50%;background:#555;display:inline-block}
.ldot.on{background:#44CC77}
.live{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,252,245,.5)}

.page{max-width:860px;margin:0 auto;padding:28px 20px 60px}

/* Client selector bar */
.selector-bar{background:var(--white);border:1px solid var(--bd);border-radius:var(--r);
  padding:16px 20px;margin-bottom:24px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.sel-group{display:flex;flex-direction:column;gap:4px}
.sel-group label{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.4px}
select,input[type=text]{padding:8px 12px;border:1px solid var(--bd);border-radius:6px;
  font-size:13px;font-family:Arial,sans-serif;color:var(--tx);background:var(--white)}
select:focus,input:focus{outline:none;border-color:var(--purple)}
#client-select{min-width:220px}
.status-toggle{display:flex;gap:0;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.st-btn{padding:8px 16px;border:none;background:var(--white);cursor:pointer;font-size:12px;
  font-weight:600;color:var(--tx3);font-family:Arial,sans-serif;transition:all .1s}
.st-btn.active-tab{background:var(--navy);color:#fff}
.add-btn{margin-left:auto;padding:9px 20px;background:var(--purple);color:#fff;border:none;
  border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.add-btn:hover{background:#6D28D9}
.add-btn:disabled{background:#ccc;cursor:default}

/* Client info banner */
.client-banner{background:var(--white);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px 20px;margin-bottom:20px;display:flex;gap:16px;align-items:center}
.cb-name{font-size:16px;font-weight:700;color:var(--navy)}
.cb-meta{font-size:11px;color:var(--tx3);margin-top:2px}
.prog-chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:4px}
.chip-sig{background:#6B5C4518;color:var(--sig)}.chip-pdi{background:#4A6C8A18;color:var(--pdi)}
.chip-both{background:#1D9E7518;color:#1D9E75}
.status-chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.chip-active{background:#EAF5EE;color:var(--green)}
.chip-disch{background:#F0EDE8;color:var(--tx3)}

/* Timeline */
.date-block{margin-bottom:24px}
.date-hdr{display:flex;align-items:center;gap:10px;padding:0 0 8px;
  border-bottom:1px solid var(--bd);margin-bottom:12px}
.date-hdr span{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
.today-tag{font-size:9px;font-weight:700;background:var(--navy);color:rgba(255,252,245,.8);
  padding:1px 7px;border-radius:10px}
.system-tag{font-size:9px;font-weight:700;background:#E8EDF5;color:var(--pdi);
  padding:1px 7px;border-radius:10px}

.entry{background:var(--white);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px 16px;margin-bottom:8px}
.entry.sys{border-left:3px solid var(--pdi);background:#F7F9FC}
.entry.endorsed{border-left:3px solid var(--green)}

.entry-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.contact-name{font-size:13px;font-weight:700;color:var(--tx)}
.contact-role{font-size:10px;color:var(--tx3);margin-top:1px}
.method-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;
  font-size:11px;font-weight:700;flex-shrink:0}
.m-call{background:#EAF5EE;color:#157A52}.m-email{background:#E8F0F8;color:#2A6099}
.m-text{background:#F0EBF9;color:#7C3AED}.m-msg{background:#FEF9EC;color:#B87A00}
.m-portal{background:#F0EDE8;color:#6B5C45}.m-other{background:#F7F5F2;color:#888877}

.entry-notes{font-size:12px;color:var(--tx2);line-height:1.55}
.entry-notes strong{color:var(--tx)}
.entry-footer{display:flex;align-items:center;justify-content:space-between;
  padding-top:8px;margin-top:8px;border-top:.5px solid var(--bd)}
.e-meta{font-size:10px;color:var(--tx3)}
.e-actions{display:flex;gap:8px;align-items:center}
.endorse-btn{font-size:11px;font-weight:700;padding:3px 12px;border-radius:12px;cursor:pointer;border:1.5px solid}
.endorse-btn.pending{border-color:#ccc;background:transparent;color:var(--tx3)}
.endorse-btn.pending:hover{border-color:var(--green);color:var(--green)}
.endorse-btn.done{border-color:var(--green);background:var(--green);color:#fff;cursor:default}
.del-btn{font-size:10px;color:var(--red);background:none;border:none;cursor:pointer;padding:2px 6px;
  border-radius:4px;opacity:.4}.del-btn:hover{opacity:1;background:#FDECEA}

.empty-log{text-align:center;padding:48px 20px;color:var(--tx3);font-size:13px}
.empty-log h3{font-size:14px;color:var(--tx2);margin-bottom:6px}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;
  align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--white);border-radius:12px;padding:24px;width:480px;max-width:95vw;
  max-height:90vh;overflow-y:auto;box-shadow:0 8px 48px rgba(0,0,0,.22)}
.modal h3{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:2px}
.modal-sub{font-size:11px;color:var(--tx3);margin-bottom:18px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--tx3);
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 11px;border:1px solid var(--bd);
  border-radius:6px;font-size:13px;font-family:Arial,sans-serif;resize:vertical}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--purple)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mb{padding:8px 4px;border:1.5px solid var(--bd);border-radius:6px;cursor:pointer;
  font-size:11px;font-weight:700;text-align:center;background:transparent;color:var(--tx3);
  font-family:Arial,sans-serif;transition:all .1s}
.mb:hover,.mb.sel{border-color:var(--purple);background:#F0EBF9;color:var(--purple)}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding-top:16px;
  border-top:.5px solid var(--bd);margin-top:4px}
.btn-cancel{padding:8px 18px;border:1px solid var(--bd);background:transparent;
  border-radius:6px;font-size:13px;cursor:pointer;color:var(--tx2)}
.btn-save{padding:8px 22px;background:var(--purple);color:#fff;border:none;
  border-radius:6px;font-size:13px;font-weight:700;cursor:pointer}
.btn-save:hover{background:#6D28D9}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-title">Communication Log</div>
  <a href="index.html" class="nav-link">&#x1F4C5; Calendar</a>
  <a href="outcomes.html" target="_blank" class="nav-link">Metrics</a>
  <a href="stipends.html" target="_blank" class="nav-link">Stipends</a>
  <div class="live"><div class="ldot" id="ldot"></div><span id="llbl">Connecting…</span></div>
</div>

<div class="page">

  <!-- Selector bar -->
  <div class="selector-bar">
    <div class="sel-group">
      <label>Status</label>
      <div class="status-toggle">
        <button class="st-btn active-tab" id="btn-active" onclick="setStatus('active')">Active</button>
        <button class="st-btn" id="btn-disch" onclick="setStatus('discharged')">Discharged</button>
        <button class="st-btn" id="btn-all" onclick="setStatus('all')">All</button>
      </div>
    </div>
    <div class="sel-group" style="flex:1;min-width:200px">
      <label>Client</label>
      <select id="client-select" onchange="selectClient(this.value)">
        <option value="">— Select a client —</option>
      </select>
    </div>
    <button class="add-btn" id="add-btn" onclick="openModal()" disabled>&#43; Add Entry</button>
  </div>

  <!-- Client banner (hidden until selected) -->
  <div class="client-banner" id="client-banner" style="display:none">
    <div style="flex:1">
      <div class="cb-name" id="cb-name"></div>
      <div class="cb-meta" id="cb-meta"></div>
    </div>
    <div id="cb-count" style="font-size:12px;color:var(--tx3)"></div>
  </div>

  <!-- Log timeline -->
  <div id="log-area">
    <div class="empty-log">
      <h3>Select a client above to view their communication log</h3>
      <p>Active clients are shown by default. Switch to Discharged or All to find past clients.</p>
    </div>
  </div>

</div>

<!-- Add Entry Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Add Communication Entry</h3>
    <div class="modal-sub" id="m-sub"></div>
    <div class="row2 fg">
      <div><label>Date</label><input type="date" id="f-date"></div>
      <div><label>Contact Role</label>
        <select id="f-role">
          <option value="Referent">Referent</option>
          <option value="Family">Family Member</option>
          <option value="Insurance">Insurance / Payer</option>
          <option value="Attorney">Attorney / Legal</option>
          <option value="Guardian">Guardian / Conservator</option>
          <option value="Facility">Referring Facility</option>
          <option value="Physician">Referring Physician</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <div class="fg"><label>Contact Name</label>
      <input type="text" id="f-contact" placeholder="e.g. Dr. Smith / Jane Smith (sister)">
    </div>
    <div class="fg"><label>Method of Communication</label>
      <div class="method-grid">
        <button class="mb sel" data-m="Call" onclick="selM(this)">&#128222; Phone Call</button>
        <button class="mb" data-m="Email" onclick="selM(this)">&#9993;&#65039; Email</button>
        <button class="mb" data-m="Text" onclick="selM(this)">&#128172; Text</button>
        <button class="mb" data-m="Left Message" onclick="selM(this)">&#128232; Left Message</button>
        <button class="mb" data-m="Portal" onclick="selM(this)">&#128274; Portal</button>
        <button class="mb" data-m="Other" onclick="selM(this)">&#128203; Other</button>
      </div>
    </div>
    <div class="fg"><label>Nature / Purpose of Contact</label>
      <textarea id="f-nature" rows="2" placeholder="Brief reason for contact…"></textarea>
    </div>
    <div class="fg"><label>Outcome / Resolution</label>
      <textarea id="f-outcome" rows="2" placeholder="What was communicated, decided, or next steps…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Save Entry</button>
    </div>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:'AIzaSyCERxntgytkfCHWN7EoAVYVmLBcfWyYZ5A',
  databaseURL:'https://pdi-signature-schedule-default-rtdb.firebaseio.com',
  projectId:'pdi-signature-schedule'
});
var DB=firebase.database();
var CLOG=DB.ref('schedule_v3/comm_log');

var allClients=[], commEntries={}, selectedClient=null, statusFilter='active', selMethod='Call';

// ── Firebase load ──────────────────────────────────────────────────────────
DB.ref('schedule_v3').on('value',function(snap){
  document.getElementById('ldot').className='ldot on';
  document.getElementById('llbl').textContent='Live';
  var raw=snap.val();
  if(!raw||!raw.blob) return;
  try{
    var d=JSON.parse(raw.blob);
    allClients=(d.clients||[]).map(function(c){
      if(!c.program){
        if(c.sigAdmit&&c.pdiAdmit&&c.pdiAdmit!==c.sigAdmit) c.program='Both';
        else if(c.sigAdmit) c.program='Signature';
        else if(c.pdiAdmit) c.program='PDI';
      }
      return c;
    }).sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
    buildDropdown();
  }catch(e){console.error(e);}
},function(){
  document.getElementById('ldot').style.background='#c00';
  document.getElementById('llbl').textContent='Offline';
});

CLOG.on('value',function(snap){
  commEntries=snap.val()||{};
  if(selectedClient) renderLog();
  buildDropdown();
});

// ── Client dropdown ────────────────────────────────────────────────────────
var TODAY=new Date().toISOString().slice(0,10);

function isActive(c){
  var disch=(c.program==='PDI'?c.pdiDischarge||c.pdiDisch:c.sigDischarge||c.sigDisch||c.endDate)||'';
  return !disch||disch>=TODAY;
}

function setStatus(s){
  statusFilter=s;
  ['active','disch','all'].forEach(function(k){
    document.getElementById('btn-'+k).className='st-btn'+(s===(k==='disch'?'discharged':k)?' active-tab':'');
  });
  buildDropdown();
}

function buildDropdown(){
  var list=allClients.filter(function(c){
    if(statusFilter==='active') return isActive(c);
    if(statusFilter==='discharged') return !isActive(c);
    return true;
  });
  var prev=document.getElementById('client-select').value;
  var html='<option value="">— Select a client ('+list.length+') —</option>';
  html+=list.map(function(c){
    var cnt=Object.values(commEntries).filter(function(e){return e.clientId===c.id;}).length;
    return '<option value="'+c.id+'">'+esc(c.name)+' ['+c.program+']'+(cnt?' ('+cnt+')':'')+
      (isActive(c)?'':' — Discharged')+'</option>';
  }).join('');
  document.getElementById('client-select').innerHTML=html;
  if(prev) document.getElementById('client-select').value=prev;
}

function selectClient(id){
  selectedClient=allClients.find(function(c){return c.id===id;})||null;
  document.getElementById('add-btn').disabled=!selectedClient;
  if(!selectedClient){
    document.getElementById('client-banner').style.display='none';
    document.getElementById('log-area').innerHTML='<div class="empty-log"><h3>Select a client above</h3></div>';
    return;
  }
  // Auto-create admission/discharge anchors
  autoAnchor(selectedClient);
  renderBanner();
  renderLog();
}

function renderBanner(){
  var c=selectedClient;
  var prog=c.program||'';
  var admit=(prog==='PDI'?c.pdiAdmit:c.sigAdmit||c.pdiAdmit)||'';
  var disch=(prog==='PDI'?c.pdiDischarge||c.pdiDisch:c.sigDischarge||c.sigDisch||c.endDate)||'';
  var active=isActive(c);
  var chipClass='chip-'+(prog==='Both'?'both':prog.toLowerCase());
  document.getElementById('cb-name').textContent=c.name;
  document.getElementById('cb-meta').innerHTML=
    '<span class="prog-chip '+chipClass+'">'+prog+'</span>'+
    (admit?'Admit: '+fmtD(admit)+' &nbsp;':'')+
    (disch?(active?'':'Discharged: '+fmtD(disch)):'')+
    ' &nbsp;<span class="status-chip '+(active?'chip-active':'chip-disch')+'">'+(active?'Active':'Discharged')+'</span>';
  var cnt=Object.values(commEntries).filter(function(e){return e.clientId===c.id&&!e.isAuto;}).length;
  document.getElementById('cb-count').textContent=cnt+' entr'+(cnt===1?'y':'ies');
  document.getElementById('client-banner').style.display='flex';
}

// ── Log render ─────────────────────────────────────────────────────────────
function renderLog(){
  if(!selectedClient)return;
  var entries=Object.entries(commEntries)
    .map(function(kv){return Object.assign({_key:kv[0]},kv[1]);})
    .filter(function(e){return e.clientId===selectedClient.id;})
    .sort(function(a,b){return (b.date||'')>(a.date||'')?1:-1;});

  if(!entries.length){
    document.getElementById('log-area').innerHTML=
      '<div class="empty-log"><h3>No entries yet</h3><p>Click <strong>+ Add Entry</strong> to log the first communication.</p></div>';
    return;
  }

  var byDate={};
  entries.forEach(function(e){var d=e.date||'0000';if(!byDate[d])byDate[d]=[];byDate[d].push(e);});

  document.getElementById('log-area').innerHTML=
    Object.keys(byDate).sort(function(a,b){return b>a?1:-1;}).map(function(dt){
      var isToday=dt===TODAY;
      var dateStr=dt==='0000'?'Unknown Date':fmtDFull(dt);
      var dayEntries=byDate[dt];
      var hasSys=dayEntries.some(function(e){return e.isAuto;});
      return '<div class="date-block">'+
        '<div class="date-hdr">'+
          '<span>'+dateStr+'</span>'+
          (isToday?'<span class="today-tag">TODAY</span>':'')+
          (hasSys?'<span class="system-tag">PROGRAM EVENT</span>':'')+
        '</div>'+
        dayEntries.map(entryHTML).join('')+
      '</div>';
    }).join('');
  renderBanner();
}

function methodPill(m){
  var map={Call:'m-call &#128222; Call',Email:'m-email &#9993; Email',
    Text:'m-text &#128172; Text','Left Message':'m-msg &#128232; Left Message',
    Portal:'m-portal &#128274; Portal',Other:'m-other &#128203; Other'};
  var s=map[m]||('m-other &#128203; '+m);
  var cls=s.split(' ')[0]; var lbl=s.slice(cls.length+1);
  return '<span class="method-pill '+cls+'">'+lbl+'</span>';
}

function entryHTML(e){
  var isEnd=!!e.isAuto;
  var isEd=!!e.endorsed;
  var cls='entry'+(isEnd?' sys':'')+(isEd?' endorsed':'');
  var eBtn=isEnd?'':(isEd
    ?'<button class="endorse-btn done">&#10003; '+esc(e.endorsedBy||'Staff')+'</button>'
    :'<button class="endorse-btn pending" onclick="endorse(\''+e._key+'\')">Endorse</button>');
  var dBtn=isEnd?'':'<button class="del-btn" onclick="delEntry(\''+e._key+'\')">&#215;</button>';
  return '<div class="'+cls+'">'+
    '<div class="entry-row1">'+
      '<div><div class="contact-name">'+esc(e.contactName||'')+'</div>'+
        '<div class="contact-role">'+esc(e.contactRole||'')+'</div></div>'+
      methodPill(e.method||'Other')+
    '</div>'+
    (e.notes?'<div class="entry-notes" style="margin-bottom:4px"><strong>Nature:</strong> '+esc(e.notes)+'</div>':'')+
    (e.outcome?'<div class="entry-notes"><strong>Outcome:</strong> '+esc(e.outcome)+'</div>':'')+
    '<div class="entry-footer">'+
      '<span class="e-meta">'+fmtTime(e.addedAt)+'</span>'+
      '<div class="e-actions">'+eBtn+dBtn+'</div>'+
    '</div>'+
  '</div>';
}

// ── Auto anchor entries ────────────────────────────────────────────────────
function autoAnchor(c){
  var existing=Object.values(commEntries).filter(function(e){return e.clientId===c.id&&e.isAuto;});
  var hasAdmit=existing.some(function(e){return e.autoType==='Admission';});
  var hasDisch=existing.some(function(e){return e.autoType==='Discharge';});
  var admit=(c.program==='PDI'?c.pdiAdmit:c.sigAdmit||c.pdiAdmit)||null;
  var disch=(c.program==='PDI'?c.pdiDischarge||c.pdiDisch:c.sigDischarge||c.sigDisch||c.endDate)||null;
  if(admit&&!hasAdmit)
    CLOG.push({clientId:c.id,clientName:c.name,date:admit,contactName:'Program Admission',
      contactRole:'Internal',method:'Other',notes:c.name+' admitted to '+c.program+' program.',
      outcome:'',isAuto:true,autoType:'Admission',addedAt:new Date().toISOString()});
  if(disch&&!hasDisch)
    CLOG.push({clientId:c.id,clientName:c.name,date:disch,contactName:'Program Discharge',
      contactRole:'Internal',method:'Other',notes:c.name+' discharged from '+c.program+' program.',
      outcome:'',isAuto:true,autoType:'Discharge',addedAt:new Date().toISOString()});
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openModal(){
  if(!selectedClient)return;
  document.getElementById('m-sub').textContent=selectedClient.name+' — '+selectedClient.program;
  document.getElementById('f-date').value=TODAY;
  document.getElementById('f-contact').value='';
  document.getElementById('f-nature').value='';
  document.getElementById('f-outcome').value='';
  document.getElementById('f-role').value='Referent';
  selMethod='Call';
  document.querySelectorAll('.mb').forEach(function(b){b.classList.toggle('sel',b.dataset.m==='Call');});
  document.getElementById('overlay').classList.add('open');
  setTimeout(function(){document.getElementById('f-contact').focus();},60);
}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function selM(btn){
  selMethod=btn.dataset.m;
  document.querySelectorAll('.mb').forEach(function(b){b.classList.remove('sel');});
  btn.classList.add('sel');
}
function saveEntry(){
  var date=document.getElementById('f-date').value;
  var contact=(document.getElementById('f-contact').value||'').trim();
  var role=document.getElementById('f-role').value;
  var nature=(document.getElementById('f-nature').value||'').trim();
  var outcome=(document.getElementById('f-outcome').value||'').trim();
  if(!date){alert('Date required.');return;}
  if(!contact){alert('Contact name required.');return;}
  CLOG.push({clientId:selectedClient.id,clientName:selectedClient.name,
    date:date,contactName:contact,contactRole:role,method:selMethod,
    notes:nature,outcome:outcome,endorsed:false,endorsedBy:'',endorsedAt:'',
    addedAt:new Date().toISOString()});
  closeModal();
}
function endorse(key){
  var name=(prompt('Enter your name to endorse:')||'').trim();
  if(!name)return;
  CLOG.child(key).update({endorsed:true,endorsedBy:name,endorsedAt:new Date().toISOString()});
}
function delEntry(key){
  if(!confirm('Delete this entry?'))return;
  CLOG.child(key).remove();
}

// ── Utilities ──────────────────────────────────────────────────────────────
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function fmtD(iso){if(!iso)return'';var d=new Date(iso+'T12:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtDFull(iso){if(!iso)return'';var d=new Date(iso+'T12:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'});}
function fmtTime(iso){if(!iso)return'';var d=new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+
    ' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}

document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
</script>
</body>
