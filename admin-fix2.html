<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Comm Log Diagnostic</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
body{font-family:Arial,sans-serif;padding:24px;background:#f7f5f2;max-width:1100px;margin:0 auto}
h2{color:#1B2A4A;margin-bottom:4px}.sub{color:#888;font-size:13px;margin-bottom:20px}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12px;margin-top:16px}
th{background:#1B2A4A;color:#fff;padding:8px 10px;text-align:left;font-size:11px}
td{padding:8px 10px;border-bottom:.5px solid #e0ddd8;vertical-align:top}
tr:nth-child(even) td{background:#fafaf8}
.ok{color:#157A52;font-weight:700}.bad{color:#991F10;font-weight:700}.amb{color:#B87A00;font-weight:700}
.log{background:#1B2A4A;color:#90EE90;padding:14px;border-radius:6px;font-family:monospace;font-size:11px;min-height:60px;white-space:pre-wrap;margin-top:16px}
button{background:#1B2A4A;color:white;padding:8px 20px;border:none;border-radius:6px;font-size:12px;cursor:pointer;margin-right:8px}
</style></head>
<body>
<h2>Comm Log Diagnostic</h2>
<p class="sub">Shows exactly what is stored in Firebase — clientId, clientName, date, contactRole — so we can see why checkmarks are not appearing.</p>
<button onclick="load()">Load Comm Log Data</button>
<button onclick="loadClients()">Load Calendar Clients</button>
<div class="log" id="log">Click Load to begin.</div>
<div id="table-wrap"></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyCERxntgytkfCHWN7EoAVYVmLBcfWyYZ5A",
  databaseURL:"https://pdi-signature-schedule-default-rtdb.firebaseio.com",
  projectId:"pdi-signature-schedule"});
var DB=firebase.database();

function log(m){var el=document.getElementById("log");el.textContent+=(el.textContent.trim()?"\n":"")+m;}

function load(){
  document.getElementById("log").textContent="Loading comm_log...";
  DB.ref("schedule_v3/comm_log").once("value",function(snap){
    var d=snap.val();
    if(!d){log("COMM LOG IS EMPTY — no entries in Firebase.");return;}
    var entries=Object.entries(d).map(function(kv){return Object.assign({_key:kv[0]},kv[1]);});
    log("Total entries: "+entries.length);
    
    // Analyse
    var noId=entries.filter(function(e){return !e.clientId;});
    var noRole=entries.filter(function(e){return !e.contactRole;});
    var referents=entries.filter(function(e){return (e.contactRole||"").toLowerCase()==="referent"&&!e.isAuto;});
    var autos=entries.filter(function(e){return e.isAuto;});
    log("Auto (system) entries: "+autos.length);
    log("Manual entries: "+(entries.length-autos.length));
    log("Referent entries: "+referents.length);
    log("Entries with NO clientId: "+noId.length);
    log("Entries with NO contactRole: "+noRole.length);
    if(noId.length>0){log("WARNING: "+noId.length+" entries have no clientId — these will NOT match any client in facesheet!");}
    
    // Show non-auto entries
    var manual=entries.filter(function(e){return !e.isAuto;});
    var html='<table><thead><tr>'
      +'<th>Key</th><th>clientId</th><th>clientName</th><th>date</th>'
      +'<th>contactRole</th><th>method</th><th>isAuto</th><th>Issue</th></tr></thead><tbody>';
    manual.forEach(function(e){
      var issues=[];
      if(!e.clientId)issues.push("No clientId");
      if(!e.contactRole)issues.push("No contactRole");
      if(e.contactRole&&e.contactRole.toLowerCase()!=="referent")issues.push("Role="+e.contactRole+" (not Referent)");
      if(!e.date)issues.push("No date");
      var ic=issues.length?"bad":"ok";
      html+="<tr>"
        +"<td style='font-size:10px;color:#888'>"+e._key.slice(-8)+"</td>"
        +"<td class='"+(e.clientId?"ok":"bad")+"'>"+(e.clientId||"MISSING")+"</td>"
        +"<td>"+(e.clientName||"")+"</td>"
        +"<td>"+(e.date||"MISSING")+"</td>"
        +"<td class='"+(e.contactRole&&e.contactRole.toLowerCase()==="referent"?"ok":"amb")+"'>"+(e.contactRole||"MISSING")+"</td>"
        +"<td>"+(e.method||"")+"</td>"
        +"<td>"+(e.isAuto?"yes":"no")+"</td>"
        +"<td class='"+ic+"'>"+(issues.join("; ")||"✓ OK")+"</td>"
        +"</tr>";
    });
    html+="</tbody></table>";
    document.getElementById("table-wrap").innerHTML=html;
  });
}

function loadClients(){
  log("Loading calendar clients...");
  DB.ref("schedule_v3/blob").once("value",function(snap){
    var v=snap.val();if(!v){log("No blob.");return;}
    try{
      var d=JSON.parse(v);
      var clients=(d.clients||[]).slice(0,30);
      log("First 30 clients:");
      clients.forEach(function(c){log("  id="+JSON.stringify(c.id)+" name="+c.name+" type="+(typeof c.id));});
    }catch(e){log("Parse error: "+e);}
  });
}
</script></body></html>
