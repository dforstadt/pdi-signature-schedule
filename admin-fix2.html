
<button id="create-missing-btn" onclick="createMissingRecords()" style="display:none;background:#F59E0B;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-weight:600;font-size:12px;cursor:pointer;margin-left:6px">+ Create Missing Records</button><!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Client Flow Export</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#FAF7F2;color:#1A1A1A;padding:20px;font-size:13px}
h2{color:#3E342A;font-size:17px;margin-bottom:3px}
.sub{color:#7A7060;font-size:11px;margin-bottom:16px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.btn{background:#3E342A;color:#fff;border:none;padding:9px 20px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:Arial,sans-serif;white-space:nowrap}
.btn:hover{background:#5C4F43}.btn:disabled{background:#bbb;cursor:default}
.btn-dl{background:#8C6A2F}.btn-dl:hover{background:#6B5020}
.btn-clr{background:#991F10;font-size:11px;padding:7px 14px}.btn-clr:hover{background:#7A1508}
.stat{font-size:11px;color:#7A7060;padding:6px 12px;background:#fff;border:1px solid #E0DDD8;border-radius:6px;white-space:nowrap}
.stat b{color:#3E342A}
.save-ind{font-size:11px;padding:6px 12px;border-radius:6px;background:#EAF5EE;color:#157A52;font-weight:600;display:none}
.save-ind.saving{background:#FEF9EC;color:#B87A00}
.log{background:#fff;border:1px solid #E0DDD8;border-radius:6px;padding:10px 14px;font-family:monospace;font-size:11px;color:#3E342A;max-height:60px;overflow-y:auto;margin-bottom:12px;white-space:pre}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid #E0DDD8;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}
th{background:#3E342A;color:#fff;padding:7px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.03em;position:sticky;top:0;z-index:2}
th.fill{background:#6B5020}
td{padding:5px 8px;border-bottom:1px solid #F5F0EA;vertical-align:middle}
tr:nth-child(even) td{background:#FAFAF7}
tr:hover td{background:#F0EDE8}
.badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 7px;border-radius:8px}
.pdi{background:#E8EDF5;color:#3E342A}.sig{background:#EFE9E0;color:#6B5C45}
.both{background:#F5F0E8;color:#8C6A2F}.unk{background:#F0EDE8;color:#999}
.warn{background:#FDECEA;color:#991F10;font-weight:700}
.yes{color:#157A52;font-weight:700}.dash{color:#ddd}
.act{color:#157A52;font-size:10px;font-weight:600}.dis{color:#888;font-size:10px}
select,input[type=text]{font-size:11px;padding:3px 6px;border:1px solid #D0CCC5;border-radius:4px;font-family:Arial,sans-serif;background:#fff;color:#1A1A1A}
select:focus,input:focus{outline:none;border-color:#8C6A2F;background:#FFFBF5}
.fill-cell{background:#FFFBF0!important}
.saved-row td.fill-cell{background:#F0FAF3!important}
.override-cell{background:#FFF5E0!important}
</style></head>
<body>
<h2>Client Flow Mapping</h2>
<p class="sub">All edits auto-save · Program overrides fix incorrect calendar program fields · Amber = fill in · Orange = program override</p>

<div class="bar">
  <button class="btn" id="load-btn" onclick="loadData()">Load All Clients</button>
  <button class="btn btn-dl" id="dl-btn" onclick="downloadExcel()" disabled>Download Excel</button>
  <button class="btn btn-clr" onclick="clearSaved()">Clear Saved Edits</button>
  <span class="stat" id="stats" style="display:none"></span>
  <span class="save-ind" id="save-ind">✓ Auto-saved</span>
</div>
<div class="log" id="log">Click Load All Clients to begin.</div>
<div class="tbl-wrap" id="tbl-wrap"></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyCERxntgytkfCHWN7EoAVYVmLBcfWyYZ5A",
  databaseURL:"https://pdi-signature-schedule-default-rtdb.firebaseio.com",
  projectId:"pdi-signature-schedule"});
var DB=firebase.database();
var EDITS_REF=DB.ref("lifeskills_clinical/client_flow_edits");
var allClients=[], rows=[], savedEdits={};
var TODAY=(function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})();
var saveTimer=null;

function log(m){var el=document.getElementById("log");el.textContent+=m+"\n";el.scrollTop=el.scrollHeight;}
function showSave(saving){var el=document.getElementById("save-ind");el.style.display="inline";el.className="save-ind"+(saving?" saving":"");el.textContent=saving?"Saving…":"✓ Auto-saved";}

function daysBetween(a,b){
  if(!a||!b)return null;
  var diff=Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);
  return diff>=0?diff:null;
}
function fmtD(iso){
  if(!iso)return"";
  try{var d=new Date(iso+"T12:00:00");return(d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear();}
  catch(e){return iso;}
}

// ── Program resolution — program field is authoritative ──────────────────────
// If saved override exists, use that. Otherwise use calendar program field.
// Falls back to admit dates only when program field is completely absent.
function resolveProgram(c, saved){
  // Saved override always wins
  if(saved && saved.programOverride) return saved.programOverride;
  
  var prog=(c.program||"").toLowerCase().trim();
  var hasPDI, hasSig;
  if(prog){
    hasPDI = prog==="pdi"||prog==="both";
    hasSig = prog==="signature"||prog==="both"||prog==="sig";
  } else {
    hasPDI = !!c.pdiAdmit;
    hasSig = !!c.sigAdmit;
    if(hasPDI&&hasSig&&c.pdiAdmit===c.sigAdmit) hasPDI=false;
  }
  if(!hasSig&&!hasPDI&&c.sigAdmit) hasSig=true;
  if(hasPDI&&hasSig) return "Both";
  if(hasPDI) return "PDI";
  if(hasSig) return "Signature";
  return "Unknown";
}

function safeKey(name){return(name||"unnamed").replace(/[.#$/[\]]/g,"_");}

// episodeKey: unique per calendar entry using Firebase id
// Handles readmissions — two admissions for same person never share a key
function episodeKey(c){
  if(c&&c.id) return safeKey(c.id);
  var admit=(c&&(c.pdiAdmit||c.sigAdmit))||"";
  return safeKey(((c&&c.name)||"unnamed")+"_"+admit);
}

var ADMIT_TYPES=["","Internal","External"];
var PRIOR_LOC=["","None","Residential","Detox","PHP","IOP","OP","Step-Down","Hospital","Other"];
// Step-down destinations — Lifeskills internal mirrored by external equivalents
var STEP_DOWN=[
  "",
  // ── Lifeskills Internal ──
  "Lifeskills PHP","Lifeskills IOP","Lifeskills OP",
  "Lifeskills Residential","Lifeskills Step-Down",
  "Lifeskills Outpatient","Signature (Lifeskills)","PDI (Lifeskills)",
  // ── External ──
  "PHP (External)","IOP (External)","OP (External)",
  "Residential (External)","Step-Down (External)",
  "Outpatient (External)","Private Practice",
  "Discharged to Home","AMA","Transferred to Facility",
  "Hospital","Deceased","Unknown"
];
// Infer type from name — "Lifeskills" = internal, else external
function sdIsInternal(sd){ return sd && sd.indexOf("Lifeskills")>=0 || sd==="Signature (Lifeskills)" || sd==="PDI (Lifeskills)"; }
var PROG_OPTS=["","PDI","Signature","Both"];

function buildRows(){
  return allClients.map(function(c,i){
    var key=episodeKey(c);
    var legacyKey=safeKey(c.name);
    var saved=savedEdits[key]||savedEdits[legacyKey]||{};
    var prog=resolveProgram(c, saved);
    var hasPDI=prog==="PDI"||prog==="Both";
    var hasSig=prog==="Signature"||prog==="Both";
    // Gate date fields on actual program to prevent false PDI on Sig-only clients
    var pdiAdmit=hasPDI?(c.pdiAdmit||""):"";
    var pdiDisch=hasPDI?(c.pdiDischarge||c.pdiDisch||""):"";
    var sigAdmit=hasSig?(c.sigAdmit||""):"";
    var sigDisch=hasSig?(c.sigDischarge||c.sigDisch||c.endDate||""):"";
    var pdiLOS=pdiAdmit?daysBetween(pdiAdmit,pdiDisch||TODAY):null;
    var sigLOS=sigAdmit?daysBetween(sigAdmit,sigDisch||TODAY):null;
    var totalLOS=pdiLOS!==null&&sigLOS!==null?pdiLOS+sigLOS:pdiLOS!==null?pdiLOS:sigLOS;
    var converted=pdiAdmit&&sigAdmit?"Yes":"No";
    var daysTillConv=pdiAdmit&&sigAdmit?daysBetween(pdiAdmit,sigAdmit):null;
    // Discharge date for this client (most recent program)
    var dischDate=prog==="PDI"?pdiDisch:prog==="Signature"?sigDisch:prog==="Both"?sigDisch:(pdiDisch||sigDisch);
    var isActive=!dischDate;
    // Step-down date defaults to discharge date if not manually overridden
    var sdDate=saved.stepDownDate||(dischDate?fmtD(dischDate):"");
    var calProg=(c.program||"").trim();
    var hasOverride=!!(saved.programOverride);
    return{
      _key:key,_idx:i,
      name:c.name||"(unnamed)",
      program:prog,calProgram:calProg,hasOverride:hasOverride,
      status:isActive?"Active":"Discharged",
      isActive:isActive,
      dischDate:fmtD(dischDate),   // raw discharge date for display
      pdiAdmit:fmtD(pdiAdmit),pdiDisch:fmtD(pdiDisch),pdiLOS:pdiLOS===null?"":pdiLOS,
      sigAdmit:fmtD(sigAdmit),sigDisch:fmtD(sigDisch),sigLOS:sigLOS===null?"":sigLOS,
      totalLOS:totalLOS===null?"":totalLOS,
      converted:converted,daysTillConv:daysTillConv===null?"":daysTillConv,
      admitType:saved.admitType||"",
      priorLOC:saved.priorLOC||"",
      priorLOClos:saved.priorLOClos||"",
      locHistory:saved.locHistory||"",
      stepDown:isActive?"":saved.stepDown||"",          // blank for active clients
      stepDownDate:isActive?"N/A":sdDate,               // N/A for active, discharge date for discharged
      notes:saved.notes||""
    };
  }).sort(function(a,b){return a.name.localeCompare(b.name);});
}

function createMissingRecords(){
  if(!allClients.length){log("Load clients first.");return;}
  var missing=allClients.filter(function(c){
    var ik=episodeKey(c),nk=safeKey(c.name);
    return!savedEdits[ik]&&!savedEdits[nk];
  });
  if(!missing.length){log("All clients already have flow records.");return;}
  log("Creating "+missing.length+" blank records…");
  var done=0;
  missing.forEach(function(c){
    var key=episodeKey(c);
    EDITS_REF.child(key).set(
      {_name:c.name,_admit:c.pdiAdmit||c.sigAdmit||"",
       admitType:"",priorLOC:"",priorLOClos:"",locHistory:"",
       stepDown:"",stepDownDate:"",notes:""},
      function(err){done++;if(done===missing.length)
        log("Created "+done+" records. Reload the page to edit them.");}
    );
  });
}

function loadData(){
  document.getElementById("load-btn").disabled=true;
  document.getElementById("load-btn").textContent="Live — auto-updating";
  document.getElementById("load-btn").style.background="#157A52";
  document.getElementById("log").textContent="";
  log("Connecting to Firebase (real-time)...");

  EDITS_REF.on("value",function(snap){
    savedEdits=snap.val()||{};
    log("Edits synced: "+Object.keys(savedEdits).length+" records.");
    if(allClients.length){rows=buildRows();renderTable();}
  },function(err){log("Edits error: "+err.message);});

  DB.ref("schedule_v3/blob").on("value",function(snap){
    var blob=snap.val();
    if(!blob){log("ERROR: No calendar data.");return;}
    try{
      var d=JSON.parse(blob);
      allClients=d.clients||[];
      var p=allClients.filter(function(c){return(c.program||"").toLowerCase().match(/pdi|both/);}).length;
      var s=allClients.filter(function(c){return(c.program||"").toLowerCase().match(/sig|both/);}).length;
      log("Roster: "+allClients.length+" clients | Calendar PDI: "+p+" | Calendar Sig: "+s);
      var cmb=document.getElementById("create-missing-btn");
      if(cmb)cmb.style.display="inline-block";
      if(Object.keys(savedEdits).length)migrateLegacyEdits();
      rows=buildRows();
      var conv=rows.filter(function(r){return r.converted==="Yes";}).length;
      document.getElementById("stats").style.display="inline";
      document.getElementById("stats").innerHTML=
        "<b>"+rows.length+"</b> total &nbsp;|&nbsp;"
        +" PDI: <b>"+rows.filter(function(r){return r.program==="PDI"||r.program==="Both";}).length+"</b>"
        +" &nbsp;|&nbsp; Sig: <b>"+rows.filter(function(r){return r.program==="Signature"||r.program==="Both";}).length+"</b>"
        +" &nbsp;|&nbsp; Conv: <b>"+conv+"</b>"
        +" &nbsp;|&nbsp; Active: <b>"+rows.filter(function(r){return r.status==="Active";}).length+"</b>"
        +" &nbsp;|&nbsp; <span style='color:#B87A00;font-weight:600'>Overrides: "+rows.filter(function(r){return r.hasOverride;}).length+"</span>";
      renderTable();
      document.getElementById("dl-btn").disabled=false;
    }catch(e){log("Parse error: "+e.message);}
  },function(err){log("ERROR: "+err.message);});
}

function migrateLegacyEdits(){
  allClients.forEach(function(c){
    var idKey=episodeKey(c);
    var nameKey=safeKey(c.name);
    if(nameKey===idKey) return;
    if(savedEdits[nameKey]&&!savedEdits[idKey]){
      // Copy old name-key data to id-key
      var patch=Object.assign({},savedEdits[nameKey],
        {_name:c.name,_admit:c.pdiAdmit||c.sigAdmit||""});
      EDITS_REF.child(idKey).update(patch,function(){
        // Delete old duplicate after successful copy
        EDITS_REF.child(nameKey).remove();
      });
      log("Migrated + cleaned: "+c.name);
    } else if(savedEdits[nameKey]&&savedEdits[idKey]){
      // Both exist — id-key is authoritative, remove name-key duplicate
      EDITS_REF.child(nameKey).remove();
      log("Removed duplicate: "+nameKey);
    }
  });
}

function saveEdits(key,field,value,cName,cAdmit){
  showSave(true);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    var p={[field]:value};
    if(cName)p._name=cName;
    if(cAdmit)p._admit=cAdmit;
    EDITS_REF.child(key).update(p,function(err){
      showSave(false);
      if(err)log("Save error: "+err.message);
    });
  },400);
}

function esc(s){var d=document.createElement("div");d.textContent=s||"";return d.innerHTML;}
function makeSelect(opts,val,key,field,cls){
  var s='<select class="'+(cls||"")+'" onchange="updateField(\''+key+'\',\''+field+'\',this.value)">';
  opts.forEach(function(o){s+='<option'+(o===val?' selected':'')+'>'+o+'</option>';});
  return s+'</select>';
}
function makeInput(val,key,field,ph,w){
  return'<input type="text" value="'+esc(val)+'" placeholder="'+ph+'" style="min-width:'+w+'px" oninput="updateField(\''+key+'\',\''+field+'\',this.value)">';
}

window.updateField=function(key,field,value){
  var row=rows.find(function(r){return r._key===key;});
  if(row)row[field]=value;
  var cName=row?row.name:"";
  var cAdmit=row?(row.pdiAdmit||row.sigAdmit):"";
  saveEdits(key,field,value,cName,cAdmit);
  if(field==="programOverride"){rows=buildRows();renderTable();}
};

function renderTable(){
  var h='<table><thead><tr>'
    +'<th>#</th><th>Client</th>'
    +'<th>Program<br><span style="font-weight:400;font-size:9px;color:#aaa">(resolved)</span></th>'
    +'<th class="override-cell" style="background:#6B5020">Program Override<br><span style="font-weight:400;font-size:9px">Fix incorrect calendar value</span></th>'
    +'<th>Cal. Field<br><span style="font-weight:400;font-size:9px;color:#aaa">(raw)</span></th>'
    +'<th>Status</th>'
    +'<th>PDI Admit</th><th>PDI Disch</th><th>PDI LOS</th>'
    +'<th>Sig Admit</th><th>Sig Disch</th><th>Sig LOS</th>'
    +'<th>Total LOS</th><th>Converted</th><th>PDI→Sig days</th>'
    +'<th class="fill">Admit Type</th>'
    +'<th class="fill">Immediate Prior LOC</th>'
    +'<th class="fill">Immed. Prior LOS (days)</th>'
    +'<th class="fill">Prior LOC History</th><th class="fill">Step-Down</th>'
    +'<th class="fill">Step-Down Date</th>'
    +'<th class="fill">Notes</th>'
    +'</tr></thead><tbody>';

  rows.forEach(function(r,i){
    var bc=r.program==="PDI"?"pdi":r.program==="Signature"?"sig":r.program==="Both"?"both":"unk";
    var sc=r.status==="Active"?"act":"dis";
    var cv=r.converted==="Yes"?"<span class='yes'>\u2713 Yes</span>":"<span class='dash'>\u2014</span>";
    var hasSaved=r.admitType||r.priorLOC||r.priorLOClos||r.locHistory||r.stepDown||r.notes;
    var mismatch=r.calProgram&&r.calProgram!==r.program&&!r.hasOverride;
    var calCell=mismatch
      ?'<span class="badge warn" title="Resolved program differs from calendar field">'+esc(r.calProgram||"\u2014")+'</span>'
      :'<span style="color:#aaa;font-size:10px">'+esc(r.calProgram||"\u2014")+'</span>';

    // Active clients: step-down fields are N/A and disabled
    var sdCell=r.isActive
      ?'<td class="fill-cell" style="background:#F5F5F5;color:#aaa;font-style:italic;font-size:10px" colspan="2">Active \u2014 N/A</td>'
      :'<td class="fill-cell">'+makeSelect(STEP_DOWN,r.stepDown,r._key,"stepDown")+'</td>'
       +'<td class="fill-cell">'+makeInput(r.stepDownDate,r._key,"stepDownDate","discharge date",90)+'</td>';

    var row='<tr'+(hasSaved?' class="saved-row"':'')+' id="row-'+r._key+'">';
    row+='<td style="color:#aaa;font-size:10px">'+(i+1)+'</td>';
    row+='<td style="font-weight:600;color:#3E342A;min-width:120px">'+esc(r.name)+'</td>';
    row+='<td><span class="badge '+bc+'">'+r.program+'</span>'+(r.hasOverride?' <span style="font-size:9px;color:#B87A00">&#9998;</span>':'')+'</td>';
    row+='<td class="override-cell">'+makeSelect(PROG_OPTS,savedEdits[r._key]&&savedEdits[r._key].programOverride||"",r._key,"programOverride")+'</td>';
    row+='<td>'+calCell+'</td>';
    row+='<td class="'+sc+'">'+r.status+'</td>';
    row+='<td>'+r.pdiAdmit+'</td><td>'+r.pdiDisch+'</td>';
    row+='<td style="font-weight:600">'+r.pdiLOS+'</td>';
    row+='<td>'+r.sigAdmit+'</td><td>'+r.sigDisch+'</td>';
    row+='<td style="font-weight:600">'+r.sigLOS+'</td>';
    row+='<td style="font-weight:700;color:#3E342A">'+r.totalLOS+'</td>';
    row+='<td>'+cv+'</td>';
    row+='<td style="color:#7A7060">'+r.daysTillConv+'</td>';
    row+='<td class="fill-cell">'+makeSelect(ADMIT_TYPES,r.admitType,r._key,"admitType")+'</td>';
    row+='<td class="fill-cell">'+makeSelect(PRIOR_LOC,r.priorLOC,r._key,"priorLOC")+'</td>';
    row+='<td class="fill-cell">'+makeInput(r.priorLOClos,r._key,"priorLOClos","days at immed. prior LOC",70)+'</td>';
    row+='<td class="fill-cell">'+makeInput(r.locHistory,r._key,"locHistory","e.g. Res 30d > PHP 14d > IOP 45d",200)+'</td>';
    row+=sdCell;
    row+='<td class="fill-cell">'+makeInput(r.notes,r._key,"notes","Notes",160)+'</td>';
    row+='</tr>';
    h+=row;
  });
  h+='</tbody></table>';
  document.getElementById("tbl-wrap").innerHTML=h;
}

function clearSaved(){
  if(!confirm("Erase all saved edits (including program overrides) for all clients?"))return;
  EDITS_REF.remove(function(err){
    if(err){log("Error: "+err.message);return;}
    savedEdits={};rows=buildRows();renderTable();
    log("Cleared.");
  });
}

function downloadExcel(){
  var data=rows.map(function(r){return{
    "Client Name":r.name,"Program":r.program,"Status":r.status,
    "Cal. Program Field":r.calProgram,
    "Program Override":savedEdits[r._key]&&savedEdits[r._key].programOverride||"",
    "PDI Admit":r.pdiAdmit,"PDI Discharge":r.pdiDisch,
    "PDI LOS (days)":r.pdiLOS===""?"":+r.pdiLOS||r.pdiLOS,
    "Sig Admit":r.sigAdmit,"Sig Discharge":r.sigDisch,
    "Sig LOS (days)":r.sigLOS===""?"":+r.sigLOS||r.sigLOS,
    "Total LOS (days)":r.totalLOS===""?"":+r.totalLOS||r.totalLOS,
    "Converted PDI→Sig":r.converted,
    "Days PDI Before Sig":r.daysTillConv===""?"":+r.daysTillConv||r.daysTillConv,
    "Admission Type":r.admitType,
    "Immediate Prior LOC":r.priorLOC,
    "Immediate Prior LOS (days)":r.priorLOClos,
    "Prior LOC History (full chain)":r.locHistory,
    "Discharge Step-Down":r.isActive?"Active - N/A":r.stepDown,
    "Step-Down Date (= Discharge Date)":r.isActive?"N/A":r.stepDownDate,
    "Notes":r.notes
  };});
  var ws=XLSX.utils.json_to_sheet(data);
  ws["!cols"]=[{wch:22},{wch:11},{wch:11},{wch:16},{wch:14},{wch:12},{wch:12},{wch:10},{wch:12},{wch:12},{wch:10},{wch:10},{wch:10},{wch:13},{wch:16},{wch:20},{wch:14},{wch:24},{wch:13},{wch:30}];
  ws["!freeze"]={xSplit:1,ySplit:1};
  ws["!dataValidation"]=[
    {sqref:"O2:O"+(data.length+1),type:"list",formulae:['"Internal,External"'],showDropDown:false},
    {sqref:"P2:P"+(data.length+1),type:"list",formulae:['"None,Residential,Detox,PHP,IOP,OP,Step-Down,Hospital,Other"'],showDropDown:false},
    {sqref:"R2:R"+(data.length+1),type:"list",formulae:['"Signature,PDI,PHP,IOP,OP,Step-Down,Residential,Private Practice,Discharged to Home,AMA,Transferred,Deceased,Unknown"'],showDropDown:false}
  ];
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Client Flow");
  XLSX.writeFile(wb,"Client_Flow_Mapping.xlsx");
  log("Downloaded: "+rows.length+" clients");
}
</script>
</body></html>
