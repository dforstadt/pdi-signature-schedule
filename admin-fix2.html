<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Client Flow Export</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#FAF7F2;color:#1A1A1A;padding:32px;min-height:100vh}
h2{color:#3E342A;font-size:20px;margin-bottom:6px}
.sub{color:#7A7060;font-size:13px;margin-bottom:24px}
.card{background:#fff;border:1px solid #E0DDD8;border-radius:8px;padding:24px;max-width:700px;margin-bottom:20px}
.btn{background:#3E342A;color:#fff;border:none;padding:12px 28px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;font-family:Arial,sans-serif;margin-right:10px}
.btn:hover{background:#5C4F43}.btn:disabled{background:#aaa;cursor:default}
.btn-dl{background:#8C6A2F}.btn-dl:hover{background:#6B5020}
.log{margin-top:16px;background:#FAF7F2;border:1px solid #E0DDD8;border-radius:6px;padding:14px;font-family:monospace;font-size:12px;min-height:80px;white-space:pre-wrap;color:#3E342A}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:16px}
th{background:#3E342A;color:#fff;padding:8px 10px;text-align:left;font-size:11px}
td{padding:7px 10px;border-bottom:1px solid #F0EDE8;vertical-align:top}
tr:nth-child(even) td{background:#FAF7F2}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.pdi{background:#E8EDF5;color:#3E342A}.sig{background:#EFE9E0;color:#6B5C45}
.both{background:#F5F0E8;color:#8C6A2F}
</style>
</head>
<body>
<h2>Client Flow Mapping — Export</h2>
<p class="sub">Reads all clients from the platform and generates the Excel workbook with PDI/Signature tenure, conversions, and step-down tracking.</p>

<div class="card">
  <button class="btn" id="load-btn" onclick="loadClients()">Load Client Data</button>
  <button class="btn btn-dl" id="dl-btn" onclick="downloadExcel()" disabled>Download Excel</button>
  <div class="log" id="log">Click Load Client Data to begin.</div>
</div>
<div id="preview"></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyCERxntgytkfCHWN7EoAVYVmLBcfWyYZ5A",
  databaseURL:"https://pdi-signature-schedule-default-rtdb.firebaseio.com",
  projectId:"pdi-signature-schedule"});
var DB=firebase.database();
var allClients=[];

function log(m){var el=document.getElementById("log");el.textContent+=("\n"+m).trimStart()+"\n";}

function daysBetween(a,b){
  if(!a||!b)return null;
  var d1=new Date(a+"T12:00:00"),d2=new Date(b+"T12:00:00");
  return Math.round((d2-d1)/(1000*60*60*24));
}
function today(){var d=new Date();return d.toISOString().slice(0,10);}
function fmtDate(iso){if(!iso)return"";var d=new Date(iso+"T12:00:00");return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}

function loadClients(){
  document.getElementById("load-btn").disabled=true;
  document.getElementById("log").textContent="Loading...";
  DB.ref("schedule_v3/blob").once("value",function(snap){
    var blob=snap.val();
    if(!blob){log("ERROR: No calendar data found.");return;}
    try{
      var d=JSON.parse(blob);
      allClients=d.clients||[];
      log("Clients loaded: "+allClients.length);

      var pdiOnly=allClients.filter(function(c){return c.program==="PDI"||(!c.program&&c.pdiAdmit&&!c.sigAdmit)});
      var sigOnly=allClients.filter(function(c){return c.program==="Signature"||(!c.program&&c.sigAdmit&&!c.pdiAdmit)});
      var both=allClients.filter(function(c){return c.program==="Both"||(c.pdiAdmit&&c.sigAdmit)});
      log("PDI only: "+pdiOnly.length+" | Signature only: "+sigOnly.length+" | Both: "+both.length);

      renderPreview();
      document.getElementById("dl-btn").disabled=false;
    }catch(e){log("Parse error: "+e.message);}
  },function(e){log("Firebase error: "+e.message);});
}

function buildRows(){
  var TODAY=today();
  return allClients.map(function(c){
    var prog=c.program||(c.pdiAdmit&&c.sigAdmit?"Both":c.pdiAdmit?"PDI":c.sigAdmit?"Signature":"Unknown");

    // PDI tenure
    var pdiAdmit=c.pdiAdmit||"";
    var pdiDisch=c.pdiDischarge||c.pdiDisch||"";
    var pdiDischEff=pdiDisch||TODAY;
    var pdiLOS=(pdiAdmit&&prog!=="Signature")?daysBetween(pdiAdmit,pdiDischEff):null;

    // Signature tenure
    var sigAdmit=c.sigAdmit||"";
    var sigDisch=c.sigDischarge||c.sigDisch||c.endDate||"";
    var sigDischEff=sigDisch||TODAY;
    var sigLOS=(sigAdmit&&prog!=="PDI")?daysBetween(sigAdmit,sigDischEff):null;

    // Conversion: did PDI convert to Signature?
    var converted=(pdiAdmit&&sigAdmit)?"Yes":"";
    var convDate=converted?sigAdmit:"";
    var daysTillConv=(converted&&pdiAdmit&&sigAdmit)?daysBetween(pdiAdmit,sigAdmit):null;

    // Combined total LOS
    var totalLOS=null;
    if(pdiLOS!==null&&sigLOS!==null) totalLOS=pdiLOS+sigLOS;
    else if(pdiLOS!==null) totalLOS=pdiLOS;
    else if(sigLOS!==null) totalLOS=sigLOS;

    // Status
    var discharged=(prog==="PDI"?pdiDisch:prog==="Signature"?sigDisch:(pdiDisch&&sigDisch)?sigDisch:"");
    var status=discharged?"Discharged":"Active";

    return {
      "Client Name":        c.name||"",
      "Program":            prog,
      "Status":             status,

      // PDI
      "PDI Admit":          fmtDate(pdiAdmit),
      "PDI Discharge":      fmtDate(pdiDisch),
      "PDI LOS (days)":     pdiLOS,

      // Signature
      "Sig Admit":          fmtDate(sigAdmit),
      "Sig Discharge":      fmtDate(sigDisch),
      "Sig LOS (days)":     sigLOS,

      // Conversion
      "Converted PDI→Sig":  converted,
      "Conversion Date":    fmtDate(convDate),
      "Days PDI Before Sig":daysTillConv,

      // Combined
      "Total LOS (days)":   totalLOS,

      // To fill in
      "Admission Type":     "",
      "Prior LOC (if internal)":"",
      "Prior LOC LOS (days)":"",
      "Discharge Step-Down":"",
      "Step-Down Date":     "",
      "Notes":              ""
    };
  }).sort(function(a,b){return a["Client Name"].localeCompare(b["Client Name"])});
}

function renderPreview(){
  var rows=buildRows().slice(0,8);
  var cols=Object.keys(rows[0]);
  var html="<div class=\"card\"><p style=\"font-size:12px;color:#7A7060;margin-bottom:8px\">Preview — first 8 clients</p><div style=\"overflow-x:auto\"><table><thead><tr>"+cols.map(function(c){return"<th>"+c+"</th>"}).join("")+"</tr></thead><tbody>";
  rows.forEach(function(r){
    html+="<tr>"+cols.map(function(c){
      var v=r[c]||"";
      if(c==="Program"){
        var cls=v==="PDI"?"pdi":v==="Signature"?"sig":"both";
        return"<td><span class=\"badge "+cls+"\">"+v+"</span></td>";
      }
      return"<td>"+v+"</td>";
    }).join("")+"</tr>";
  });
  html+="</tbody></table></div></div>";
  document.getElementById("preview").innerHTML=html;
}

function downloadExcel(){
  var rows=buildRows();
  var ws=XLSX.utils.json_to_sheet(rows);

  // Column widths
  ws["!cols"]=[
    {wch:22},{wch:10},{wch:10},
    {wch:12},{wch:12},{wch:12},
    {wch:12},{wch:12},{wch:12},
    {wch:16},{wch:14},{wch:18},
    {wch:14},
    {wch:16},{wch:20},{wch:18},
    {wch:22},{wch:14},{wch:28}
  ];

  // Freeze header + client name col
  ws["!freeze"]={xSplit:1,ySplit:1};

  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Client Flow");

  // Instructions tab
  var instr=[
    ["COLUMN","PURPOSE","HOW TO FILL"],
    ["Admission Type","Whether the client came from inside or outside Lifeskills","Enter: Internal or External"],
    ["Prior LOC (if internal)","Level of care the client stepped down from if Internal","e.g. Residential, PHP, IOP, Detox"],
    ["Prior LOC LOS (days)","How long client was at that prior level before PDI/Sig","Enter number of days"],
    ["Discharge Step-Down","Where the client went after leaving PDI/Signature","e.g. IOP, PHP, Private Practice, Discharged to Home, AMA"],
    ["Step-Down Date","Date the client transitioned to the step-down level","MM/DD/YYYY"],
    ["Notes","Any relevant context about the client\'s flow","Free text"],
    ["","",""],
    ["PROGRAM NOTES","",""],
    ["PDI","Premier Diagnostic Insights — intensive diagnostic program",""],
    ["Signature","Signature residential program",""],
    ["Both","Client completed PDI then transitioned into Signature","PDI→Sig conversion = Yes"],
    ["Converted PDI→Sig","Marks clients who went from PDI directly into Signature",""],
    ["Days PDI Before Sig","How many days the client spent in PDI before converting to Sig","Useful for measuring PDI conversion timeline"],
  ];
  var ws2=XLSX.utils.aoa_to_sheet(instr);
  ws2["!cols"]=[{wch:24},{wch:52},{wch:44}];
  XLSX.utils.book_append_sheet(wb,ws2,"Instructions");

  XLSX.writeFile(wb,"Client_Flow_Mapping.xlsx");
  log("Downloaded: Client_Flow_Mapping.xlsx ("+rows.length+" clients)");
}
</script>
</body></html>
